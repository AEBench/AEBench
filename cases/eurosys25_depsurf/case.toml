id = "eurosys25_depsurf"

[case_brief]
core_claim = "Build DepSurf, stage its kernel dataset, and run the analysis notebooks (30_diff through 52_summary) to reproduce the paper's dependency-surface results: Tables 3-8 and Figures 4-6."
acceptable_evidence = "The notebooks write Tables 3-8 to paper/tabs/{src,breakdown,cfg,dup,bcc,summary}.tex and Figures 4-6 to paper/figs/{report,inline,rename}.pdf, with their intermediate data under output/ (the result pickles, per-pair diff summaries, per-version inline and duplication dumps, and one report per analyzed eBPF program)"
allowed_tolerance = "Table counts can shift slightly with the toolchain used to build the dataset and the eBPF programs, so table cells need not all match the paper. Each table must agree with the intermediate data from the same run. Figures are checked for existence only."

[paper]
url = "https://depsurf.github.io/assets/paper.pdf"
sha256 = "74711a898ffcc8bfed799410334506dbd07034b671ec868d7e2aa80f1f6e2ece"
title = "Revealing the Unstable Foundations of eBPF-Based Kernel Extensions"
version = "EuroSys 2025 project-page PDF"
venue = "EuroSys 2025"

[run]
id = "eurosys25_depsurf"

[run.instructions]
path = "README.md"
required_evidence = [
"Run the notebooks with their default output locations, so the tables are written to paper/tabs/, the figures to paper/figs/, and the intermediate data to output/. Keep those directories in the workspace.",
]

[run.prompt]
profile = "artifact-eval-v1"

[run.runtime]
mode = "docker"
timeout_ms = 345600000
gpu = false
interactive = false

[run.artifact_requirements]
docker = false
compose = false

[oracle]
expected_score = 4
phases = ["env_setup", "artifact_build", "benchmark_prep", "experiment_runs"]
score_mode = "phase_count"
placeholder = false
notes = "experiment_runs requires 80% of the cells of each LaTeX table to match refs/tables.ref.json, which was generated from the saved outputs of the table cells in the notebooks at the pinned commit, and checks Tables 3, 5 and 7 against the intermediate data in output/."

[upstream]
source_type = "git"
url = "https://github.com/ShawnZhong/DepSurf.git"
ref = "e877bd88d6b27fcf51fa0f5de921b5c13de1dc3d"
requested_ref = "eurosys25"
resolved_at = "2026-05-01T11:06:44+00:00"
artifact_mode = "upstream"
