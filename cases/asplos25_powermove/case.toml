id = "asplos25_powermove"

[case_brief]
core_claim = "Run all 23 circuit configurations in PowerMove's Table 3. Reproduce its fidelity and simulated execution-time advantage over Enola, and the storage zone's fidelity benefits and movement overhead."
acceptable_evidence = "New results and complete compiler logs cover all seven circuit families, with Enola and PowerMove with and without storage. Fidelity components match the circuit references and their product equals total fidelity. PowerMove without storage improves fidelity and execution time over Enola, with a larger fidelity advantage at each family's largest size than its smallest. Storage eliminates excitation error and improves fidelity by at least 100x for the largest QFT, BV, and QSim circuits compared with PowerMove without storage. Both VQE sizes have lower total fidelity with storage than without it."
allowed_tolerance = "All 23 configurations and both comparisons are required. Gate and excitation fidelities allow 1% relative or 1e-8 absolute tolerance. Movement, coherence, and total fidelity can vary with placement, so they must satisfy the stated consistency checks and comparisons. Intermediate sizes need not improve monotonically. Compilation wall time and the Figure 7 multi-AOD experiments are outside this case's scope."

[paper]
title = "PowerMove: Optimizing Compilation for Neutral Atom Quantum Computers with Zoned Architecture"
venue = "ASPLOS 2025"
url = "https://arxiv.org/pdf/2411.12263v1"
sha256 = "673a950a4790193c53d63d9278b84a18d821461ff079e7e7597be51f4d367b2c"
version = "arXiv v1 corresponding to the ASPLOS 2025 paper"

[run]
id = "asplos25_powermove"

[run.instructions]
path = "README.md"
required_evidence = [
  "Run both upstream test_scripts/<family>_storage_compare.py and <family>_no_storage_compare.py for these Table 3 configurations: qaoa_regular3 at 30, 40, 50, 60, 80, 100 qubits; qaoa_regular4 at 30, 40, 50, 60, 80; qaoa_random at 20, 30; qsim_rand_0.3 at 10, 20, 40; qft at 18, 29; vqe at 30, 50; and bv at 14, 50, 70. Use released instance i0 for QAOA and QSim, and random seed 0 for each configuration. Preserve the compiler algorithms.",
  "Keep the 14 newly generated data/<script-stem>.txt comparison files in the upstream list-per-line format and complete stdout and stderr under logs/<script-stem>.log. If sizes run separately, combine their rows in size order and retain every corresponding compiler log. Preserve the edited scripts used for execution. Checked-in results alone are insufficient.",
]

