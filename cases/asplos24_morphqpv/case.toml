id = "asplos24_morphqpv"

[case_brief]
core_claim = "Reproduce the MorphQPV paper's empirical results: Quantum Lock verification speedup (Fig 7), verification confidence with reduced synthesis overhead against baselines (Table 4), execution time reduction (Fig 11a), accuracy bounds (Fig 11b), confidence distribution bounds (Fig 15), and the Clifford vs. basis gate ablation study (Fig 15a)."
acceptable_evidence = "Generated CSVs and graphical plots (PDF/SVG) for the corresponding experiments exist. For quantitative bounds: Table 4 shows MorphQPV achieving exactly 100% confidence while maintaining lower gate synthesis overhead than the NDD baseline; Figure 15a shows Clifford sampling reaching 100% accuracy at 64 samples; and the remaining generated CSV data strongly correlates (Pearson >= 0.85) with the expected reference distributions."
allowed_tolerance = "Minor variations in raw runtime execution metrics (like exact millisecond timing) or slight differences in randomized sample distributions are expected due to hardware speed and random seeding. Graphical plots (SVGs and PDFs) are evaluated strictly for existence rather than visual equivalence."

[run]
id = "asplos24_morphqpv"

[run.instructions]
path = "README.md"
required_evidence = [
    "Output files should be successfully generated and stored in their respective output directories under `examples/`.",
    "`examples/fig7-quantumlock_verify/quantumlock.csv` and its accompanying `.svg`.",
    "`examples/table4-compare/overhead.csv`.",
    "`examples/fig11a-theorem1/time.csv` and `fig9(a).svg`.",
    "`examples/fig11b-theorem2/fig9(b)-theorem2.svg`.",
    "`examples/fig15-confidence/confidence.svg` and `distribution_samples64.csv`.",
    "`examples/fig11-opt_strategy/optimize.pdf` (Note: Requires internet for MNIST dataset).",
    "`examples/fig15a-ablation_study/accuracy.csv` and `fig12(a)-ablation_study.pdf`.",
    "`examples/fig15b-solvers_compare/time.csv` and `runtime.svg`."
]

[run.runtime]
mode = "docker"
image = "aebench-agent:latest"
timeout_ms = 14400000
gpu = false
interactive = false

[run.artifact_requirements]
docker = true
compose = false

[run.prompt]
profile = "artifact-eval-v1"

[oracle]
expected_score = 4
failure_mode = "fail_fast"
placeholder = false


[oracle.targets.morphqpv]
type = "docker_image"
image = "morphqpv"
working_dir = "/workspace/MorphQPV"



[oracle.phase_targets]
env_setup = "local"
artifact_build = "morphqpv"
benchmark_prep = "morphqpv"
experiment_runs = "local"

[upstream]
source_type = "git"
url = "https://github.com/JanusQ/MorphQPV"
ref = "ab704fb7bbba4297c5338c61cef6975565b8c241"