id = "atc26_mbcheck"

[case_brief]
core_claim = "Build MBCheck against LLVM 18, SVF 3.2 and herd7 7.58, generate the Linux v6.19 arm64 IR corpus, and reproduce the paper's evaluation: the whole-kernel sweep behind Tables 4-7 and 9, and the 23-case microbenchmark of Table 8 in which every correctly synchronised pattern is a true negative."
acceptable_evidence = "The oracle accepts a passing scripts/selftest.sh with an Ok herd7 verdict, a 3,160-module corpus whose MANIFEST matches the README, a sweep-v619.json over that corpus whose litmus tests are on disk and whose Table 4, 6, 7 and 9 counts and Table 5 breakdown match the artifact README's v6.19 expectations, and a table8.json with 23 TN and 0 FP."
allowed_tolerance = "The corpus module count and Table 8's 23 TN / 0 FP are exact; corpus IR lines may differ by 0.01%, since Clang 18 point releases emit slightly different IR. Sweep counts in Tables 4, 6, 7 and 9 may differ from the README's values by 10% (at least 1), since they move with how many modules finish inside the 120 s per-module timeout; the ranked orders of Tables 6 and 7 and the set of violating modules in Table 9 must match. Table 5 shares and peak RSS depend on the machine: only a complete stage breakdown led by the transpiler and herd7 is required."

[paper]
title = "MBCheck: Practical Static Analysis Framework for Detecting Memory Ordering Violations under WMM"
venue = "USENIX ATC 2026"
url = "https://github.com/ssrg-vt/mbcheck"
sha256 = "fd0de45801e26323ae8e9c0069e6596c43b361c0fa23e03383faa47932c9d3ef"
notes = "sha256 is of the artifact-evaluation submission copy (atc26ae-paper90.pdf); no public PDF yet."

[run]
id = "atc26_mbcheck"

[run.instructions]
path = "README.md"
required_evidence = [
  "Keep the README's locations for the large inputs: SVF 3.2 built in ~/SVF, the Linux v6.19 arm64 kernel built in ~/linux-6.19, and the IR corpus generated by scripts/build-kernel-ir.sh in ~/ir-v6.19 together with its MANIFEST.",
  "Leave herd7 7.58 runnable as `herd7` from a fresh login shell (`bash -lc 'herd7 -version'`), for example through opam's default root ~/.opam or a PATH entry in ~/.profile, so scripts/selftest.sh finds it without extra environment variables.",
  "Build mbcheck at build/mbcheck in the repository.",
  "Run the claims with scripts/run.sh and its default results directory, and keep results/sweep-v619.json, results/litmus-v619/, results/sync-ir/ and results/table8.json.",
]

[run.runtime]
mode = "docker"
image = "aebench-agent:latest"
timeout_ms = 21600000
gpu = false
interactive = false
commit_before_oracle = true
keep_committed_snapshot = false
# The container layer holds SVF, a built kernel tree and the IR corpus.
snapshot_timeout_seconds = 3600.0

[run.artifact_requirements]
docker = false
compose = false

[run.prompt]
profile = "artifact-eval-v1"

[oracle]
expected_score = 4
failure_mode = "fail_fast"
placeholder = false

[oracle.phase_targets]
env_setup = "task"
artifact_build = "task"
benchmark_prep = "task"
experiment_runs = "task"

[upstream]
source_type = "git"
url = "https://github.com/ssrg-vt/mbcheck.git"
ref = "c957bbef1f8865a40370166fbc62a3d0b8eb041c"
requested_ref = "main"
resolved_at = "2026-10-02T03:08:41+00:00"
