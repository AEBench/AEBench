id = "eurosys25_visualinux"

[case_brief]
core_claim = "Visualinux can handle various data structures and components in the Linux kernel by extracting expected kernel object graphs (C1), and it achieves this with an acceptable performance overhead (C4)."
acceptable_evidence = "The Linux kernel builds successfully with vmlinux and bzImage. Expected JSON plots are successfully exported and contain all structures and files matching the reference results.json. The performance overhead profile (visualinux-sync.perf) has a Pearson correlation >= 0.8 against the reference baseline."
allowed_tolerance = "Exact performance metrics may vary across different hardware environments, but the overall statistical distribution of the top 50 execution overheads must preserve the reference trend (Pearson correlation >= 0.8)."

[paper]
title = "Understanding the Linux Kernel, Visually"
venue = "EuroSys 2025"
url = "https://www.usenix.org/system/files/osdi25-leblanc.pdf"
sha256 = "0a06c653f7c62860fd64848e598e63942d49be951acd2aa945eceb667a298ab6"

