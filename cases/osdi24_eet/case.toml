id = "osdi24_eet"

[case_brief]
core_claim = "Build the EET executable and the evaluated database systems natively (without Docker), run EET against each database, and reproduce the expected bug counts."
acceptable_evidence = "The oracle accepts the built EET binary, the evaluated database systems built at the paper's versions, and one directory per detected bug under <db>_test/bugs for each database."
allowed_tolerance = "Bug counts must match the oracle's expected totals exactly for the evaluated benchmarks."

[paper]
url = "https://www.usenix.org/system/files/osdi24-jiang.pdf"
sha256 = "4d3b059aef9fb016fee4ae72c7dcb0d73ae9569bdf431f297063d3712a2fcf4c"
title = "Detecting Logic Bugs in Database Engines via Equivalent Expression Transformation"
version = "USENIX OSDI 2024 proceedings version"
venue = "OSDI 2024"

[run]
id = "osdi24_eet"

[run.instructions]
path = "README.md"

[run.prompt]
profile = "artifact-eval-v1"
append = """
NO DOCKER:
- Docker is not available in this environment. Do not install or start Docker.
- Do not run scripts/<db>/run_test.sh, build_docker.sh, cat_docker.sh or stop_docker.sh. They require Docker, but you can read them.
- Build EET natively, following "Compile EET in Debian" in README.md.
- Build and install each database natively in this environment, at the version used for artifact evaluation.
  scripts/<db>/run_test.sh shows how each source is obtained, scripts/<db>/Dockerfile how it is built,
  and scripts/<db>/test_setup.sh how the server and EET are started.
- Put each database's source in <repo>/<db>_test/, in the directory scripts/<db>/run_test.sh downloads it to, and build it inside that directory.

BUG RESULTS:
- For each database <db> (mysql, postgres, sqlite, clickhouse, tidb), store every bug EET reports in its own subdirectory of <repo>/<db>_test/bugs/, laid out the way scripts/<db>/cat_docker.sh would produce it:
  - logic bug: db_setup.sql, origin.sql, eet.sql, origin.out, eet.out (from the test's minimized/ directory)
  - crash: db_setup.sql, unexpected.sql, unexpected.err
- Each subdirectory must hold exactly one bug.
"""

[run.runtime]
mode = "docker"
timeout_ms = 345600000
gpu = false
interactive = false

[run.artifact_requirements]
docker = false
compose = false

[oracle]
expected_score = 4
phases = ["env_setup", "artifact_build", "benchmark_prep", "experiment_runs"]
score_mode = "phase_count"
placeholder = false
notes = "Native (no-Docker) variant: the agent builds EET and the databases in its own container; bugs are collected under <db>_test/bugs."

[upstream]
source_type = "git"
url = "https://github.com/JZuming/EET.git"
ref = "b31d2534bc1079fdeda5333c73bcb99b611efe8e"
resolved_at = "2026-03-10T03:23:39.155767+00:00"
artifact_mode = "upstream"
