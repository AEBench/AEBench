id = "osdi25_bpftime"

[case_brief]
core_claim = "Build the bpftime userspace eBPF runtime and run all eight microbenchmarks in paper Table 3. Reproduce its lower overhead for uprobes, uretprobes, userspace-memory access, and hash-map updates and deletions, along with its higher overhead for syscalls and hash-map lookups."
acceptable_evidence = "Raw samples cover kernel eBPF and bpftime for every Table 3 operation. Summary statistics match the raw samples, and the six improvements and two tradeoffs agree with the paper."
allowed_tolerance = "Every configuration requires at least three positive finite samples. Latency and speedup magnitude vary across machines. Each operation must preserve the paper's comparison between kernel eBPF and bpftime."

[paper]
url = "https://www.usenix.org/system/files/osdi25-zheng-yusheng.pdf"
sha256 = "2717c4619708f534915e7b567feaa6a1001e1a5f782268e47e7dabdefb380de4"
title = "Extending Applications Safely and Efficiently"
version = "USENIX OSDI 2025 proceedings version"
venue = "OSDI 2025"

[run]
id = "osdi25_bpftime"

[run.instructions]
path = "README.md"
required_evidence = [
  "Run the released uprobe benchmark for at least three iterations and keep benchmark/uprobe/benchmark-output.json and benchmark/uprobe/benchmark-logs.txt.",
  "Run the released syscall benchmark and keep its benchmark/syscall/syscall_benchmark_results_<timestamp>.json output. Preserve all native, kernel, and userspace raw samples generated by both benchmarks.",
]

[run.runtime]
mode = "local"
timeout_ms = 14400000
gpu = false
interactive = false

[run.artifact_requirements]
docker = false
compose = false

[run.artifact_requirements.hardware]
cpu_count = 4
memory_gb = 16
network = true
notes = "Linux x86_64 host with kernel eBPF support and permission to run the kernel-side microbenchmarks."

[run.prompt]
profile = "artifact-eval-v1"

[oracle]
expected_score = 4
placeholder = false

[oracle.phase_targets]
env_setup = "task"
artifact_build = "task"
benchmark_prep = "task"
experiment_runs = "task"

[upstream]
source_type = "git"
url = "https://github.com/eunomia-bpf/bpftime.git"
ref = "8a359fc86438b8b3b0b58e38cff0b190c7e68893"
artifact_mode = "upstream"
