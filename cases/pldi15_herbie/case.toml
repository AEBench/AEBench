id = "pldi15_herbie"

[case_brief]
core_claim = "Reproduce the PLDI 2015 Herbie paper's Hamming floating-point accuracy experiment using the newer pinned arith25 implementation. This case covers accuracy improvement on the Hamming suite, not the original 2015 implementation, exact paper numbers, runtime overhead, or later Chassis experiments."
acceptable_evidence = "A generated HTML report and results.json from an optimization run with seed 286210900 and four iterations, all 28 Hamming benchmarks present exactly once, finite error measurements, no accuracy regressions, at least one strict accuracy improvement, and start/end error correlations with the reference."
allowed_tolerance = "Use seed 286210900 and four optimization iterations. The reference was generated in Linux arm64 Docker with Racket 8.7; macOS error distributions differ. Start-error Pearson correlation must be at least 0.90 and end-error correlation at least 0.50; exact PLDI 2015 numbers are not required."

[paper]
title = "Automatically Improving Accuracy for Floating Point Expressions"
venue = "PLDI 2015"
url = "https://herbie.uwplse.org/pldi15-paper.pdf"
sha256 = "e9642512aa5bbb61db322367708e005ee16213c57d260d1739d89448db82c3ee"

[run]
id = "pldi15_herbie"

[run.instructions]
path = "README.md"

[run.runtime]
mode = "docker"
timeout_ms = 14400000
gpu = false
interactive = false

[run.prompt]
profile = "artifact-eval-v1"
append = """
This is the PLDI 2015 Herbie Hamming accuracy case, using the pinned newer
arith25 code. Initialize its QD submodule with git submodule update --init --recursive
before building. Follow README.md for installation, then run from the repository root:
    racket src/main.rkt report --seed 286210900 --num-iters 4 bench/hamming/ graphs/
The arith25 snapshot defaults to zero optimization iterations, so --num-iters 4
is required. Generate the complete HTML and JSON report for all 28 Hamming examples.
This experiment checks the original paper's accuracy-improvement trend with newer
code; it does not reproduce the exact 2015 results or evaluate Chassis.
"""

[oracle]
expected_score = 4
phases = ["env_setup", "artifact_build", "benchmark_prep", "experiment_runs"]
score_mode = "phase_count"
placeholder = false

[upstream]
source_type = "git"
url = "https://github.com/herbie-fp/herbie"
ref = "bc2ffceea037e01fbff58f5895849dbf3bbdbf9e"
requested_ref = "arith25"
resolved_at = "2026-05-01T11:06:44+00:00"
artifact_mode = "upstream"
