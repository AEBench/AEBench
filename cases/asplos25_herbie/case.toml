id = "asplos25_herbie"

[case_brief]
core_claim = "Build Chassis and reproduce target-aware speed/accuracy comparisons against Clang and Herbie from ASPLOS 2025."
acceptable_evidence = "The released reduced evaluation covers all 81 Hamming and mathematics benchmarks, includes all 12 Clang configurations and all nine targets (eight on ARM), and demonstrates measured speedups at equal or better accuracy against Herbie on each target and against Clang. Figures 7-9 and the cost/time plot must be generated."
allowed_tolerance = "Use the authors' reduced evaluation with seed 1. Timings vary by hardware, so require a strictly faster candidate at no worse error on at least one benchmark per target; exact paper speedup factors and aggregate Pareto curves are not scored."

[paper]
title = "Target-Aware Implementation of Real Expressions"
venue = "ASPLOS 2025"
url = "https://arxiv.org/pdf/2410.14025v3"
sha256 = "5c9ffb562d8987c3421610fb76efb59b090329c57ce20c17335296fc2d7c5a01"

[run]
id = "asplos25_herbie"

[run.instructions]
path = "ASPLOS25.md"
required_evidence = [
  "Run the reduced evaluation with seed 1: mkdir -p reports; THREADS=2 NUM_SEEDS=1 START_SEED=1 bash infra/platforms-eval.sh reports bench/hamming bench/mathematics. On ARM set NO_AVX=1 as documented in ASPLOS25.md.",
  "Preserve reports/platforms/output/hamming-1/results.json and reports/platforms/output/mathematics-1/results.json, their per-target reports, and the four aggregate PNG plots under reports/platforms/output/.",
  "Run make install after the evaluation completes: infra/platforms-eval.sh ends with make clean, which removes the Racket packages needed to start Chassis.",
  "Save the installation and evaluation logs. Tutorial-only output is insufficient.",
]

[run.runtime]
mode = "docker"
timeout_ms = 14400000
gpu = false
interactive = false
snapshot_timeout_seconds = 900

[run.prompt]
profile = "artifact-eval-v1"

[oracle]
expected_score = 4
phases = ["env_setup", "artifact_build", "benchmark_prep", "experiment_runs"]
score_mode = "phase_count"
placeholder = false

