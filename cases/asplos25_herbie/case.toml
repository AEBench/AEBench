id = "asplos25_herbie"

[case_brief]
core_claim = "Build Herbie, run the floating-point accuracy benchmarks, and reproduce the end-to-end error improvements reported in the paper."
acceptable_evidence = "A report from the pinned Herbie revision must cover the 28 Hamming benchmarks, improve accuracy on a majority of them, and show no accuracy regressions."
allowed_tolerance = "Numerical error values may vary across runs; the bundled zero-iteration baseline supplies benchmark names, not optimized error values."

[paper]
title = "Automatically Improving Accuracy for Floating Point Expressions"
venue = "PLDI 2015"
