id: W72
title: A command with a skipped untracked walk runs after an untracked input's writer
description: >
  LW9: e1's untracked walk was skipped, so it may have written the
  untracked out.csv after e2 created it. The risk names the narrower
  reason untracked_skipped.
rules: [LW9]
calls:
  - {call_id: c2, seq: 0, command: python3 eval.py > out.csv, t_start: 9.5, t_end: 11.0}
  - {call_id: c1, seq: 1, command: ./build.sh, t_start: 49.5, t_end: 51.0}
execs:
  - {command_id: e2, command: python3 eval.py > out.csv, t_start: 10.0, duration_s: 1.0}
  - {command_id: e1, command: ./build.sh, t_start: 50.0, duration_s: 1.0,
     snapshot: {modified: [lib/core.c], untracked_skipped: too many}}
links:
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: write_event, event_id: w0, path: out.csv, writer_id: e2,
     op: create}
  - {link_type: write_event, event_id: w1, path: lib/core.c, writer_id: e1}
paths:
  - {path: out.csv, events: [w0], final_writer: w0, tracked: false,
     final_state: untracked, final_writer_under: false}
  - {path: lib/core.c, events: [w1], final_writer: w1}
oracle_inputs:
  - {input_id: i0, path: out.csv}
  - {input_id: i1, path: lib/core.c}
input_states:
  - {input_id: i0, states_over: [command_written], grading_exists: true,
     tracked: false, content_source: final_workspace, blind_execs: [e1],
     unseen_writer_possible: true}
  - {input_id: i1, states_over: [command_written], grading_exists: true,
     content_source: final_diff, blind_execs: []}
expect:
  last_writers:
    - {input_id: i0, last_writer: w0,
       later_writer_risk: [{id: e1, item_type: exec, reason: untracked_skipped}],
       last_writer_under: false}
    - {input_id: i1, last_writer: w1, later_writer_risk: [],
       last_writer_under: true}
