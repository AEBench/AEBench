id: W68
title: Layer 3's row leaves binary_content unknown; the diff says binary
description: >
  HK1 (D49): binary_content null means layer 3 did not decide, so the
  diff section's own evidence (structure.binary_sections, BIN1) decides;
  a row's true or false is taken as given.
rules: [HK1]
run:
  capabilities: {final_content: true}
  final_diff_content: monitor/final.diff
paths:
  - {path: data/img.png}
  - {path: src/a.py}
file_classes:
  - {path: data/img.png, file_class: data, binary_content: null}
  - {path: src/a.py, file_class: code, binary_content: null}
final_diff: |
  diff --git a/data/img.png b/data/img.png
  index 3333333..4444444 100644
  Binary files a/data/img.png and b/data/img.png differ
  diff --git a/src/a.py b/src/a.py
  index 5555555..6666666 100644
  --- a/src/a.py
  +++ b/src/a.py
  @@ -1,2 +1,2 @@
   import os
  -x = 1
  +x = 2
expect:
  row_counts: {hunks: 1}
  hunks:
    - {path: src/a.py, hunk_index: 0, hunk_type: numeric_only}
  metrics:
    M4.3: {files_binary: 1, files_classified: 1, hunks_total: 1}
  diff_files_unclassified:
    - {path: data/img.png, reason: binary}
