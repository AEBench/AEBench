id: W19
title: The writer's recorded hash against the hash read, or the end hash
rules: [LW11]
run:
  capabilities: {content_hashes: true, oracle_reads: true}
calls:
  - {call_id: c1, seq: 0, command: ./gen_a.sh, t_start: 9.5, t_end: 11.0}
  - {call_id: c2, seq: 1, command: ./gen_b.sh, t_start: 19.5, t_end: 21.0}
  - {call_id: c3, seq: 2, command: ./gen_c.sh, t_start: 29.5, t_end: 31.0}
execs:
  - {command_id: e1, command: ./gen_a.sh, t_start: 10.0, duration_s: 1.0,
     snapshot: {modified: [out/a.json], hashes: {/repo/out/a.json: AB12}}}
  - {command_id: e2, command: ./gen_b.sh, t_start: 20.0, duration_s: 1.0,
     snapshot: {modified: [out/b.json], hashes: {/repo/out/b.json: cc}}}
  - {command_id: e3, command: ./gen_c.sh, t_start: 30.0, duration_s: 1.0,
     snapshot: {modified: [out/c.json], hashes: {out/c.json: EE}}}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: call_exec, call_id: c3, command_id: e3}
  - {link_type: write_event, event_id: w0, path: out/a.json, writer_id: e1}
  - {link_type: write_event, event_id: w1, path: out/b.json, writer_id: e2}
  - {link_type: write_event, event_id: w2, path: out/c.json, writer_id: e3}
paths:
  - {path: out/a.json, events: [w0], final_writer: w0}
  - {path: out/b.json, events: [w1], final_writer: w1}
  - {path: out/c.json, events: [w2], final_writer: w2, final_state: reverted}
oracle_inputs:
  - {input_id: i0, path: out/a.json, source_type: graded, grading_exists: true,
     grading_sha256: ab12}
  - {input_id: i1, path: out/b.json, source_type: graded, grading_exists: true,
     grading_sha256: dd}
  - {input_id: i2, path: out/c.json, source_type: graded}
input_states:
  - {input_id: i0, states_over: [command_written], grading_exists: true,
     content_source: grading_read, grading_sha256: ab12}
  - {input_id: i1, states_over: [command_written], grading_exists: true,
     content_source: grading_read, grading_sha256: dd}
  - {input_id: i2, states_over: [rewritten_identical], tracked: true,
     baseline_sha256: ee, grading_exists: true, content_source: final_diff}
expect:
  last_writers:
    - {input_id: i0, hash_confirms_writer: true, read_version: unverified}
    - {input_id: i1, hash_confirms_writer: false, read_version: unverified}
    - {input_id: i2, hash_confirms_writer: true, read_version: unverified}
  bases: {hash_confirms_writer: exact, read_version: fallback}
