id: W10
title: A blind exec with a skipped snapshot runs after the last writer
rules: [LW9]
calls:
  - {call_id: c1, seq: 0, command: ./gen.sh, t_start: 9.5, t_end: 11.0}
  - {call_id: c2, seq: 1, command: ./tidy.sh, t_start: 49.5, t_end: 51.0}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 1.0}
  - {command_id: e2, command: ./tidy.sh, t_start: 50.0, duration_s: 1.0,
     snapshot: {status: skipped, skip_reason: limit}}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: write_event, event_id: w0, path: out/r.json, writer_id: e1}
paths:
  - {path: out/r.json, events: [w0], final_writer: w0}
oracle_inputs:
  - {input_id: i0, path: out/r.json}
input_states:
  - {input_id: i0, states_over: [command_written], grading_exists: true,
     content_source: final_diff, blind_execs: [e2]}
expect:
  last_writers:
    - {input_id: i0, last_writer: w0,
       later_writer_risk: [{id: e2, item_type: exec, reason: blind_snapshot}],
       last_writer_under: false, not_under: [later_writer_risk]}
