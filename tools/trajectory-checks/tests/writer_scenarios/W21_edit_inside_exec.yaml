id: W21
title: An edit call inside a running exec whose event names it
rules: [LW3]
calls:
  - {call_id: c1, seq: 0, command: ./watch.sh, t_start: 9.5, t_end: 31.0}
  - {call_id: c2, seq: 1, tool_type: edit, paths: [out/x.txt], t_start: 15.0}
execs:
  - {command_id: e1, command: ./watch.sh, t_start: 10.0, duration_s: 20.0}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: write_event, event_id: w0, path: out/x.txt, writer_id: c2}
  - {link_type: write_event, event_id: w1, path: out/x.txt, writer_id: e1,
     possibly_edit_call: c2}
paths:
  - {path: out/x.txt, events: [w0, w1], final_writer: w0}
oracle_inputs:
  - {input_id: i0, path: out/x.txt}
input_states:
  - {input_id: i0, states_over: [edit_written], grading_exists: true,
     content_source: final_diff}
expect:
  last_writers:
    - {input_id: i0, last_writer: w0, last_writer_type: edit_call,
       last_writer_candidates: [w0], root_candidates: [c2],
       last_writer_under: true}
  input_rewrites:
    - {input_id: i0, rewrites_over: 0, delete_roots: []}
