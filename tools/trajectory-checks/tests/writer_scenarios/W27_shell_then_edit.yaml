id: W27
title: A shell writer, then an edit call writes the input
rules: [RW3, RW4]
calls:
  - {call_id: c1, seq: 0, command: ./gen.sh, t_start: 9.5, t_end: 11.0}
  - {call_id: c2, seq: 1, tool_type: edit, paths: [out/r.csv], t_start: 50.0}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 1.0}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: write_event, event_id: w0, path: out/r.csv, writer_id: e1}
  - {link_type: write_event, event_id: w1, path: out/r.csv, writer_id: c2}
paths:
  - {path: out/r.csv, events: [w0, w1], final_writer: w1}
oracle_inputs:
  - {input_id: i0, path: out/r.csv}
input_states:
  - {input_id: i0, states_over: [edit_written], grading_exists: true,
     content_source: final_diff}
expect:
  input_rewrites:
    - input_id: i0
      members:
        - {call_id: c1, seq: 0, member_type: shell, events: [w0],
           first_lo: 10.0, last_hi: 13.0, under: true, outcome: ok,
           command_shape: ./gen.sh, numeric_args: [], arg_count: 1,
           rerun_key: ./gen.sh}
        - {call_id: c2, seq: 1, member_type: edit, events: [w1],
           first_lo: 49.0, last_hi: 51.0, under: true, outcome: null,
           command_shape: null, numeric_args: null, arg_count: null,
           rerun_key: null}
      pairs:
        - {prev_call_id: c1, call_id: c2, after: ok, same_key: false,
           writer_switched: true, args_changed: false, shape_changed: null,
           under: true}
  last_writers:
    - {input_id: i0, last_writer: w1, last_writer_role: edit_call}
