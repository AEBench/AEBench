id: W70
title: With an unseen writer possible, a file the writer did not read has in_read null
description: >
  FLT3 (D53 (3)): layer 4's unseen_writer_possible means a writer outside
  the candidates cannot be excluded, so a file the chosen writer did not
  read is null, not false; one it read stays true.
rules: [FLT3]
run:
  capabilities: {final_content: true, read_tracing: true}
  final_diff_content: monitor/final.diff
calls:
  - {call_id: c2, seq: 0, command: nohup ./srv.sh &, t_start: 99.5, t_end: 101.0}
  - {call_id: c1, seq: 1, command: ./gen.sh, t_start: 499.5, t_end: 501.0}
execs:
  - {command_id: e2, command: nohup ./srv.sh &, t_start: 100.0, duration_s: 1.0, reads: []}
  - {command_id: e1, command: ./gen.sh, t_start: 500.0, duration_s: 1.0, reads: [src/a.py]}
links:
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: write_event, event_id: w0, path: out/r.json, writer_id: e1}
paths:
  - {path: out/r.json, events: [w0], final_writer: w0}
oracle_inputs:
  - {input_id: i0, path: out/r.json}
input_states:
  - {input_id: i0, states_over: [command_written], grading_exists: true,
     content_source: final_diff, detached_execs: [e2],
     unseen_writer_possible: true}
final_diff: |
  diff --git a/src/a.py b/src/a.py
  index 1111111..2222222 100644
  --- a/src/a.py
  +++ b/src/a.py
  @@ -1,2 +1,2 @@
   import os
  -x = 1
  +x = 2
  diff --git a/src/b.py b/src/b.py
  index 3333333..4444444 100644
  --- a/src/b.py
  +++ b/src/b.py
  @@ -1,2 +1,2 @@
   import os
  -y = 1
  +y = 2
expect:
  bases: {in_read: exact}
  last_writers:
    - {input_id: i0, last_writer: w0, later_writer_risk: [],
       last_writer_under: true}
  hunks:
    - {path: src/a.py, hunk_index: 0, in_read: true}
    - {path: src/b.py, hunk_index: 0, in_read: null}
