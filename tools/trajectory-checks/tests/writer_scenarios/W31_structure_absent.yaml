id: W31
title: Without layer 3, rerun keys and file classes are void
rules: [PRE5]
run:
  capabilities: {final_content: true}
  final_diff_content: monitor/final.diff
structure: absent
calls:
  - {call_id: c1, seq: 0, command: ./gen.sh, t_start: 9.5, t_end: 11.0}
  - {call_id: c2, seq: 1, command: ./gen.sh, t_start: 29.5, t_end: 31.0}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 1.0}
  - {command_id: e2, command: ./gen.sh, t_start: 30.0, duration_s: 1.0}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: write_event, event_id: w0, path: out/r.csv, writer_id: e1}
  - {link_type: write_event, event_id: w1, path: out/r.csv, writer_id: e2}
paths:
  - {path: out/r.csv, events: [w0, w1], final_writer: w1}
oracle_inputs:
  - {input_id: i0, path: out/r.csv}
input_states:
  - {input_id: i0, states_over: [command_written], grading_exists: true,
     content_source: final_diff}
final_diff: |
  diff --git a/src/a.py b/src/a.py
  index 1111111..2222222 100644
  --- a/src/a.py
  +++ b/src/a.py
  @@ -1,2 +1,2 @@
   import os
  -x = 1
  +x = 2
expect:
  preconditions: {repeats: fails, file_class: fails}
  input_rewrites:
    - input_id: i0
      pairs:
        - {prev_call_id: c1, call_id: c2, after: ok, same_key: null,
           writer_switched: null, args_changed: null, shape_changed: false,
           under: true}
      rewrites_over: 1
  metrics:
    M2.4: {writer_switches_over: null, writer_switches_under: null,
           args_changed_over: null, args_changed_under: null,
           rewrites_total_over: 1, rewrites_after_ok_over: 1}
    M4.3: {hunks_by_class_and_type: null, hunks_total: 1,
           hunks_by_type_read: null}
  hunks:
    - {path: src/a.py, hunk_index: 0, file_class: null, hunk_type: numeric_only,
       language: python}
