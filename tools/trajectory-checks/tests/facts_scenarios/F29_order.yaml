name: F29_order
description: Records given out of order with tied start times; rows follow seq, and exec seq breaks ties by command_id.
rules: [OUTF1]
calls:
  - {call_id: c2, seq: 1, command: b, t_start: 10}
  - {call_id: c1, seq: 0, command: a, t_start: 10}
execs:
  - {command_id: e2, command: b, t_start: 10.1}
  - {command_id: e1, command: a, t_start: 10.1}
links:
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: call_exec, call_id: c1, command_id: e1}
expect:
  call_facts:
    c1: {seq: 0, command_id: e1}
    c2: {seq: 1, command_id: e2}
  exec_facts:
    e1: {seq: 0}
    e2: {seq: 1}
