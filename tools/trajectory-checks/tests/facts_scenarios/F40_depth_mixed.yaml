name: F40_depth_mixed
description: With parent_links but one descendant's broker depth missing, depth is no longer exact and depth_max_under is null (S7).
rules: [NST2, NST3, NST4]
run: {capabilities: {parent_links: true}}
calls:
  - {call_id: c1, command: make, t_start: 0}
execs:
  - {command_id: e1, command: make, t_start: 0.1, duration_s: 10, depth: 2}
  - {command_id: e2, command: "sh -c a", t_start: 1, duration_s: 8, depth: 3}
  - {command_id: e3, command: "sh -c b", t_start: 2, duration_s: 6}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: exec_parent, command_id: e2, parent: e1, root_call_id: c1}
  - {link_type: exec_parent, command_id: e3, parent: e2, root_call_id: c1}
expect:
  call_facts:
    c1: {descendants_over: 2, depth_max_under: null}
  exec_facts:
    e1: {depth: 0}
    e2: {depth: 1}
  facts:
    M1.4.depth_max_under: null
