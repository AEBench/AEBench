name: F23_same_shape
description: Two calls that differ only in a number and a directory have one shape and different numeric arguments.
rules: [SHP2, SHP4, SHP7, SHP9]
calls:
  - {call_id: c1, command: "./bench --n 100 /repo/out/a", t_start: 10}
  - {call_id: c2, command: "./bench --n 5 /tmp/x/a", t_start: 20}
execs:
  - {command_id: e1, command: "./bench --n 100 /repo/out/a", t_start: 10.1}
  - {command_id: e2, command: "./bench --n 5 /tmp/x/a", t_start: 20.1}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: call_exec, call_id: c2, command_id: e2}
expect:
  call_facts:
    c1: {command_shape: "bench --n N a", numeric_args: ["100"], arg_count: 4, programs: [bench]}
    c2: {command_shape: "bench --n N a", numeric_args: ["5"], arg_count: 4}
  facts:
    M1.2.shell_calls: 2
    M1.2.root_shapes: 1
