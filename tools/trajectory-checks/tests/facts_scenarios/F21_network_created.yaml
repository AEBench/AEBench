name: F21_network_created
description: A download created while no other command ran (under), one while another call's shell ran (over only), and one unobserved download.
rules: [NET4, NET5]
calls:
  - {call_id: c1, command: "curl -o a.bin u", t_start: 10}
  - {call_id: c2, command: sleep 100, t_start: 20}
  - {call_id: c3, command: "wget u -O b.bin", t_start: 30}
  - {call_id: c4, command: "curl -O u2", t_start: 200}
execs:
  - {command_id: e1, command: "curl -o a.bin u", t_start: 10.1, duration_s: 2, snapshot: {scope: workspace, created: [a.bin]}}
  - {command_id: e2, command: sleep 100, t_start: 20.1, duration_s: 100, snapshot: {scope: workspace}}
  - {command_id: e3, command: "wget u -O b.bin", t_start: 30.1, duration_s: 2, snapshot: {scope: workspace, created: [b.bin]}}
  - {command_id: e4, command: "curl -O u2", t_start: 200.1, duration_s: 1, snapshot: {status: skipped, scope: null, skip_reason: too many files}}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: call_exec, call_id: c2, command_id: e2}
  - {link_type: call_exec, call_id: c3, command_id: e3}
  - {link_type: call_exec, call_id: c4, command_id: e4}
  - {link_type: write_event, path: a.bin, writer_id: e1, op: create, scope: workspace}
  - {link_type: write_event, path: b.bin, writer_id: e3, op: create, scope: workspace}
paths:
  - {path: a.bin, tracked: false, final_state: untracked}
  - {path: b.bin, tracked: false, final_state: untracked}
coverage:
  rates.untracked_visible: true
  rates.snapshot_scope: workspace
expect:
  path_facts:
    a.bin: {network_created_under: true, network_created_over: true}
    b.bin: {network_created_under: false, network_created_over: true}
  facts:
    M6.1.network_files_created_under: 1
    M6.1.network_files_created_over: 2
    M6.1.network_execs_unobserved: 1
    M6.1.network_execs_over: 3
