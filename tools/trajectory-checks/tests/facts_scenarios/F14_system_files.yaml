name: F14_system_files
description: System diff counts without AEBench's own entries, and an edit outside the workspace.
rules: [SYS1, SYS2, SYS3]
calls:
  - {call_id: c1, tool_type: write, raw_name: Write, t_start: 10, paths: [/tmp/x.py]}
links:
  - {link_type: write_event, path: /tmp/x.py, writer_id: c1, in_workspace: false, op: create}
paths:
  - {path: /tmp/x.py, tracked: false, final_state: untracked}
system_diff:
  changed: 9
  executables: ["A /usr/sbin/docker-init", "A /usr/local/bin/tool"]
  python_startup: ["A /home/u/.local/lib/python3/site-packages/x.pth"]
  etc: ["C /etc/passwd", "C /etc/group-", "A /etc/tool.conf"]
expect:
  facts:
    preconditions.system_diff: holds
    M4.4.executables: 1
    M4.4.python_startup: 1
    M4.4.etc: 1
    M4.4.changed_total: 9
    M4.4.outside_workspace_writes: 1
