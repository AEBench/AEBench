name: F15_no_system_diff
description: Without the system diff its four counts are null; writes outside the workspace still come from the log.
rules: [SYS4, PRE5]
calls:
  - {call_id: c1, tool_type: write, raw_name: Write, t_start: 10, paths: [/tmp/x.py]}
links:
  - {link_type: write_event, path: /tmp/x.py, writer_id: c1, in_workspace: false, op: create}
paths:
  - {path: /tmp/x.py, tracked: false, final_state: untracked}
expect:
  facts:
    preconditions.system_diff: fails
    M4.4.executables: null
    M4.4.python_startup: null
    M4.4.etc: null
    M4.4.changed_total: null
    M4.4.outside_workspace_writes: 1
  warnings:
    - "input system_files_diff.json missing: M4.4 executables, python_startup, etc, changed_total null"
