name: S51_collapsed_untracked
description: A collapsed untracked folder makes its command a possible unseen writer of the paths under that folder only -> vendor/x keeps its listed create as final writer but not under, since e2 may have written it later; evaluation/a.log and vendor/z, written after e2, stay under; no event is invented for the folder (§6.6, per-path rule 2).
calls:
  - {call_id: c1, t_start: 100, t_end: 110, command: "./fetch.sh"}
  - {call_id: c2, t_start: 200, t_end: 210, command: "./vendor.sh"}
  - {call_id: c3, t_start: 300, t_end: 310, command: "./eval.sh"}
  - {call_id: c4, t_start: 400, t_end: 410, command: "./pin.sh"}
execs:
  - {command_id: e1, t_start: 100.2, t_end: 109, command: "./fetch.sh", snapshot: {scope: tracked, created_untracked: [vendor/x], modified_untracked: [], deleted_untracked: [], collapsed_untracked: []}}
  - {command_id: e2, t_start: 200.2, t_end: 209, command: "./vendor.sh", snapshot: {scope: tracked, created_untracked: [], modified_untracked: [], deleted_untracked: [], collapsed_untracked: [{dir: vendor, files: 2100, created: 0, modified: 5, deleted: 0}]}}
  - {command_id: e3, t_start: 300.2, t_end: 309, command: "./eval.sh", snapshot: {scope: tracked, created_untracked: [evaluation/a.log], modified_untracked: [], deleted_untracked: [], collapsed_untracked: []}}
  - {command_id: e4, t_start: 400.2, t_end: 409, command: "./pin.sh", snapshot: {scope: tracked, created_untracked: [vendor/z], modified_untracked: [], deleted_untracked: [], collapsed_untracked: []}}
baseline: {files: {lib/core.c: {}}}
final_diff: {modified: [], deleted: [], mode_changed: []}
expect:
  links:
    - {link_type: write_event, path: vendor/x, op: create, writer_id: e1}
    - {link_type: write_event, path: evaluation/a.log, op: create, writer_id: e3}
    - {link_type: write_event, path: vendor/z, op: create, writer_id: e4}
  links_exact: true
  links_absent:
    - {link_type: write_event, path: vendor}
    - {link_type: write_event, writer_id: e2}
  paths:
    - {path: vendor/x, events: [w0], final_writer: w0, final_writer_under: false, final_state: untracked, unattributed_candidates: []}
    - {path: evaluation/a.log, events: [w1], final_writer: w1, final_writer_under: true, final_state: untracked}
    - {path: vendor/z, events: [w2], final_writer: w2, final_writer_under: true, final_state: untracked}
  coverage:
    counts.snapshot_collapsed: 1
    counts.snapshot_untracked_skipped: 0
    counts.snapshot_status_counts: {ok: 4, skipped: 0, truncated: 0, absent: 0}
    rates.snapshot_count_coverage: 1.0
