name: S52_untracked_skipped_after
description: A command whose untracked walk was skipped is fully observed for tracked paths and a possible unseen writer of untracked paths only -> lib/core.c has its exact writer e1, under; out.csv, created by e2 before e1 ran, keeps e2 as final writer but not under; a tracked final-diff path nobody listed gets no candidate from e1 (§6.6, per-path rules 2 and 4).
calls:
  - {call_id: c2, t_start: 100, t_end: 110, command: "python3 eval.py > out.csv"}
  - {call_id: c1, t_start: 200, t_end: 210, command: "./build.sh"}
execs:
  - {command_id: e2, t_start: 100.2, t_end: 109, command: "python3 eval.py > out.csv", snapshot: {scope: tracked, created_untracked: [out.csv], modified_untracked: [], deleted_untracked: [], collapsed_untracked: []}}
  - {command_id: e1, t_start: 200.2, t_end: 209, command: "./build.sh", snapshot: {scope: tracked, modified: [lib/core.c], untracked_skipped: "too many"}}
baseline: {files: {lib/core.c: {}, lib/util.c: {}}}
final_diff: {modified: [lib/core.c, lib/util.c], deleted: [], mode_changed: []}
expect:
  paths:
    - {path: out.csv, events: [w0], final_writer: w0, final_writer_under: false, final_state: untracked}
    - {path: lib/core.c, events: [w1], final_writer: w1, final_writer_under: true, final_state: changed}
    - {path: lib/util.c, events: [], final_writer: null, final_writer_under: false, final_state: changed, unattributed_candidates: []}
  coverage:
    counts.snapshot_collapsed: 0
    counts.snapshot_untracked_skipped: 1
    counts.snapshot_status_counts: {ok: 2, skipped: 0, truncated: 0, absent: 0}
    rates.snapshot_count_coverage: 1.0
