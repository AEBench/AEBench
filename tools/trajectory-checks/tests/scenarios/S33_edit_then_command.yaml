name: S33_edit_then_command
description: An edit-tool change to config.yaml, then a command rewrites it -> two events; final writer = the command; the edit stays in events (§6.6).
calls:
  - {call_id: c1, tool_type: edit, raw_name: Edit, t_start: 100, t_end: 101, paths: ["/repo/config.yaml"]}
  - {call_id: c2, t_start: 200, t_end: 201, command: "sed -i s/a/b/ config.yaml"}
execs:
  - {command_id: e2, t_start: 200.2, t_end: 200.5, command: "sed -i s/a/b/ config.yaml", snapshot: {modified: [config.yaml]}}
baseline: {files: {config.yaml: {}}}
final_diff: {modified: [config.yaml], deleted: [], mode_changed: []}
expect:
  links:
    - {link_type: write_event, event_id: w0, path: config.yaml, writer_type: edit_call, writer_id: c1, possibly_edit_call: null}
    - {link_type: write_event, event_id: w1, path: config.yaml, writer_type: exec, writer_id: e2, root_call_id: c2, possibly_edit_call: null, root_ambiguous: false}
  links_exact: true
  paths:
    - {path: config.yaml, events: [w0, w1], final_writer: w1, final_writer_under: true, final_state: changed}
  coverage:
    rates.edit_at_risk_rate: 0.0
