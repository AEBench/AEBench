name: S32_three_writers
description: out.csv written by three successive commands -> three events in order, final writer = the third (§6.6, per-path rules 1-2).
calls:
  - {call_id: c1, t_start: 100, t_end: 111, command: "python3 gen.py"}
  - {call_id: c2, t_start: 200, t_end: 211, command: "python3 gen.py"}
  - {call_id: c3, t_start: 300, t_end: 311, command: "python3 gen.py"}
execs:
  - {command_id: e1, t_start: 100.2, t_end: 110.2, command: "python3 gen.py", snapshot: {modified: [out.csv]}}
  - {command_id: e2, t_start: 200.2, t_end: 210.2, command: "python3 gen.py", snapshot: {modified: [out.csv]}}
  - {command_id: e3, t_start: 300.2, t_end: 310.2, command: "python3 gen.py", snapshot: {modified: [out.csv]}}
baseline: {files: {out.csv: {}}}
final_diff: {modified: [out.csv], deleted: [], mode_changed: []}
expect:
  links:
    - {link_type: write_event, event_id: w0, path: out.csv, writer_id: e1, root_call_id: c1, t_start: 100.2, t_end: 110.2}
    - {link_type: write_event, event_id: w1, path: out.csv, writer_id: e2, root_call_id: c2}
    - {link_type: write_event, event_id: w2, path: out.csv, writer_id: e3, root_call_id: c3}
  links_exact: true
  paths:
    - {path: out.csv, events: [w0, w1, w2], final_writer: w2, final_writer_under: true, final_state: changed}
