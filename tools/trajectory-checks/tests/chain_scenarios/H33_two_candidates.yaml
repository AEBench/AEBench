id: H33
title: Layer 5 reports two candidate last writers
rules: [CH1, FA6]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./a.sh, t_start: 10.0, duration_s: 5.0,
     reads: []}
  - {command_id: e2, command: ./b.sh, t_start: 12.0, duration_s: 4.0,
     reads: []}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
  - {link_type: write_event, path: out/r.json, writer_id: e2}
oracle_inputs:
  - {path: out/r.json}
last_writers:
  - {input_id: i0, last_writer_candidates: [w0, w1], last_writer_under: false,
     not_under: [several_candidates]}
expect:
  chain_nodes:
    - {input_id: i0, node_id: w0, hop: 1, must: false}
    - {input_id: i0, node_id: w1, hop: 1, must: false}
  row_counts: {chain_nodes: 2}
  faithfulness:
    - {input_id: i0, writer_event: w1, chain_time_under_s: null,
       clauses: {untampered: null}}
  reasons_include: {i0: {untampered: several_candidates}}
  metrics:
    M3.4: {chain_nodes_under: 0, chain_nodes_over: 2}
