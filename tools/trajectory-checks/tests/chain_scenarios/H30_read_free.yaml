id: H30
title: A run without read tracing uses the read-free chains
rules: [CH7, TM3]
execs:
  - {command_id: e1, command: "./tool.sh --k 3", t_start: 10.0, duration_s: 5.0}
  - {command_id: e2, command: python3 agg.py, t_start: 100.0, duration_s: 2.0}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: out/mid.csv, writer_id: e1}
  - {link_type: write_event, path: out/r.json, writer_id: e2}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --k 3",
       options: {--k: {value: "3", value_type: int}}}
    - {invocation_key: agg.py, text: python3 agg.py}
expect:
  bases: {chain: fallback}
  preconditions: {reads: fails, delta_complete: fails}
  metrics_null: [M3.4]
  metrics:
    M1.5: {chain_time_under_s: 2.0, chain_time_over_s: 7.0,
           chain_time_mode: read_free}
    M5.1: {options_compared_under: 0, options_compared_over: 1,
           scope_under: writer, scope_over: before_writer}
  chain_nodes:
    - {input_id: i0, node_id: w1, hop: 1, must: true, code_paths: [agg.py]}
    - {input_id: i0, node_id: w0, hop: 2, must: false}
  row_counts: {hop_reads: 0, chain_nodes: 2}
  faithfulness:
    - {input_id: i0, mode: read_free, witness: "e2:0",
       chain_time_under_s: 2.0, chain_time_over_s: 7.0,
       clauses: {fresh: holds, derived: holds, built: null,
                 untampered: holds},
       faithful: null}
