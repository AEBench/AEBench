id: H29
title: A pristine data file read by the witness itself, or downstream of it
rules: [FA7]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: python3 agg.py, t_start: 10.0, duration_s: 2.0,
     reads: [/repo/agg.py, /repo/data/in.csv]}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, op: create, writer_id: e1}
paths:
  - {path: out/r.json, tracked: false}
baseline_files: [agg.py, data/in.csv, step.sh]
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: agg.py, text: python3 agg.py}
runs:
  - expect:
      faithfulness:
        - {input_id: i0, witness: "e1:0", clauses: {unmodified: holds}}
  - execs:
      - {command_id: e1, command: ./step.sh, t_start: 10.0, duration_s: 5.0,
         reads: [/repo/step.sh]}
      - {command_id: e2, command: python3 agg.py, t_start: 20.0,
         duration_s: 2.0,
         reads: [/repo/agg.py, /repo/out/mid.csv, /repo/data/in.csv]}
    dispositions:
      e1: {disposition: matched_root, root_under: true}
      e2: {disposition: matched_root, root_under: true}
    links:
      - {link_type: write_event, path: out/mid.csv, op: create, writer_id: e1}
      - {link_type: write_event, path: out/r.json, op: create, writer_id: e2}
    paths:
      - {path: out/mid.csv, tracked: false}
      - {path: out/r.json, tracked: false}
    declared:
      invocations:
        - {invocation_key: step.sh, text: ./step.sh}
    expect:
      faithfulness:
        - {input_id: i0, witness: "e1:0", clauses: {unmodified: null}}
