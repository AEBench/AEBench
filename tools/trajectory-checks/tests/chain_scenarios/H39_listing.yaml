id: H39
title: A node lists a folder whose files were created in the run
rules: [RD6]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 5.0,
     reads: []}
  - {command_id: e2, command: python3 agg.py, t_start: 20.0, duration_s: 5.0,
     reads: [/repo/results]}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: results/a.csv, op: create, writer_id: e1}
  - {link_type: write_event, path: out/r.json, op: create, writer_id: e2}
paths:
  - {path: results/a.csv, tracked: false}
  - {path: out/r.json, tracked: false}
oracle_inputs:
  - {path: out/r.json}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: results, version: w0,
       read_type: listing, must: false}
  chain_nodes:
    - {input_id: i0, node_id: w0, hop: 2, must: false}
  metrics:
    M3.4: {chain_nodes_under: 1, chain_nodes_over: 2}
