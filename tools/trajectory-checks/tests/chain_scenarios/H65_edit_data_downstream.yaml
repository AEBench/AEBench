id: H65
title: A must-chain data read downstream of the witness was typed by an edit call
rules: [FA7]
run:
  capabilities: {read_tracing: true}
calls:
  - {call_id: c2, tool_type: edit, t_start: 25.0}
execs:
  - {command_id: e1, command: ./bench.sh, t_start: 10.0, duration_s: 10.0,
     reads: []}
  - {command_id: e2, command: python3 agg.py, t_start: 40.0, duration_s: 2.0,
     reads: [/repo/out/raw.csv, /repo/data/fix.csv]}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: out/raw.csv, op: create, writer_id: e1}
  - {link_type: write_event, path: data/fix.csv, writer_id: c2}
  - {link_type: write_event, path: out/r.json, op: create, writer_id: e2}
paths:
  - {path: out/raw.csv, tracked: false}
  - {path: out/r.json, tracked: false}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: bench.sh, text: ./bench.sh}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w2, read_path: data/fix.csv, version: w1,
       state: edit_tool, must: true, code_read: false}
  faithfulness:
    - {input_id: i0, witness: "e1:0", clauses: {unmodified: violated}}
