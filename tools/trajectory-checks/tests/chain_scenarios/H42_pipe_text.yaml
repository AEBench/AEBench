id: H42
title: Two piped commands as nested execs, without parent links
rules: [CH5]
run:
  capabilities: {read_tracing: true}
calls:
  - {call_id: c1, command: "./gen.sh | ./agg.sh > out/r.txt", t_start: 9.0}
execs:
  - {command_id: e1, command: "./gen.sh | ./agg.sh > out/r.txt",
     t_start: 10.0, duration_s: 10.0, reads: []}
  - {command_id: e2, command: ./gen.sh, t_start: 11.0, duration_s: 5.0,
     reads: []}
  - {command_id: e3, command: ./agg.sh, t_start: 11.0, duration_s: 6.0,
     reads: []}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: exec_parent, command_id: e2, parent: e1, root_call_id: c1}
  - {link_type: exec_parent, command_id: e3, parent: e1, root_call_id: c1}
  - {link_type: write_event, path: out/r.txt, writer_id: e3}
oracle_inputs:
  - {path: out/r.txt}
declared:
  invocations:
    - {invocation_key: gen.sh, text: ./gen.sh}
    - {invocation_key: agg.sh, text: ./agg.sh}
expect:
  bases: {pipes: fallback}
  row_counts: {arg_checks: 2}
  arg_checks:
    - {command_id: e2, invocation: 0, option: null,
       in_scope: {writer: [], chain_under: [], chain_over: [i0]}}
    - {command_id: e3, invocation: 0, option: null,
       in_scope: {writer: [i0], chain_under: [i0], chain_over: [i0]}}
