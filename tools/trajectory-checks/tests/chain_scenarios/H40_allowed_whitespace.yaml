id: H40
title: A code file read by the chain differs from the baseline only in whitespace
rules: [FA4, CT4]
run:
  capabilities: {read_tracing: true, final_content: true}
  final_diff_content: monitor/final.diff
calls:
  - {call_id: c0, tool_type: edit, t_start: 5.0}
execs:
  - {command_id: e1, command: python3 agg.py, t_start: 10.0, duration_s: 5.0,
     reads: [/repo/src/lib.py, /repo/agg.py]}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: src/lib.py, writer_id: c0}
  - {link_type: write_event, path: out/r.json, op: create, writer_id: e1}
paths:
  - {path: out/r.json, tracked: false}
classes: {src/lib.py: code}
baseline_files: [agg.py]
hunks:
  - {path: src/lib.py, hunk_type: whitespace_only}
oracle_inputs:
  - {path: out/r.json}
spec:
  allowed_diff_classes: [whitespace_only]
expect:
  preconditions: {hunks: holds}
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: src/lib.py, version: w0,
       state: edit_tool, code_read: true, must: true}
  chain_nodes:
    - {input_id: i0, node_id: w1, code_state: changed}
  faithfulness:
    - {input_id: i0, clauses: {built: holds}}
