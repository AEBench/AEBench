id: H24
title: A code read of an untracked file the tracked snapshots cannot see
rules: [RD4, FA4, FA5]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: python3 agg.py, t_start: 10.0, duration_s: 2.0,
     reads: [/repo/agg.py, /repo/lib/util.py]}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
baseline_files: [agg.py]
oracle_inputs:
  - {path: out/r.json}
declared:
  options:
    - {invocation_key: other.py, option: --k}
runs:
  - {}
  - coverage:
      rates.snapshot_scope: workspace
      rates.untracked_visible: true
    expect:
      preconditions: {untracked_visible: holds}
      hop_reads:
        - {input_id: i0, reader_node: w0, read_path: lib/util.py,
           version: null, state: unseen}
expect:
  preconditions: {untracked_visible: fails, declared: holds}
  hop_reads:
    - {input_id: i0, reader_node: w0, read_path: lib/util.py, version: null,
       state: invisible, code_read: true, code_rule: class}
  chain_nodes:
    - {input_id: i0, node_id: w0, code_state: unknown,
       code_paths: [agg.py, lib/util.py]}
  faithfulness:
    - {input_id: i0, witness: null,
       clauses: {built: null, unmodified: null}}
