id: H23
title: Another exec writes the read path while the reader runs
rules: [RD3]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 5.0,
     reads: []}
  - {command_id: e2, command: python3 agg.py, t_start: 20.0, duration_s: 30.0,
     reads: [/repo/data/x.csv]}
  - {command_id: e3, command: ./gen.sh, t_start: 30.0, duration_s: 5.0,
     reads: []}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
  e3: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: data/x.csv, writer_id: e1}
  - {link_type: write_event, path: data/x.csv, writer_id: e3}
  - {link_type: write_event, path: out/r.json, writer_id: e2}
oracle_inputs:
  - {path: out/r.json}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w2, read_path: data/x.csv, version: w0,
       must: false, state: derived}
    - {input_id: i0, reader_node: w2, read_path: data/x.csv, version: w1,
       must: false, state: derived}
  chain_nodes:
    - {input_id: i0, node_id: w2, must: true, hop: 1}
    - {input_id: i0, node_id: w0, must: false, hop: 2}
    - {input_id: i0, node_id: w1, must: false, hop: 2}
  metrics:
    M3.4: {chain_nodes_under: 1, chain_nodes_over: 3, hop2_reads_under: 0,
           hop2_reads_over: 1, hop2_writers_under: 0, hop2_writers_over: 2}
