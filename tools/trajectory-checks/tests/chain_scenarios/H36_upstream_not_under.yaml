id: H36
title: An upstream write event whose writer is uncertain
rules: [RD3, CH3]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./sim, t_start: 10.0, duration_s: 10.0,
     reads: []}
  - {command_id: e2, command: python3 agg.py, t_start: 50.0, duration_s: 2.0,
     reads: [/repo/data/raw.csv]}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: data/raw.csv, writer_id: e1,
     writer_under: false}
  - {link_type: write_event, path: out/r.json, writer_id: e2}
oracle_inputs:
  - {path: out/r.json}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: data/raw.csv, version: w0,
       must: false}
  chain_nodes:
    - {input_id: i0, node_id: w0, hop: 2, must: false}
    - {input_id: i0, node_id: w1, hop: 1, must: true}
