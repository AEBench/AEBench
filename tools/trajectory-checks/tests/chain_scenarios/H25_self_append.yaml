id: H25
title: A node reads and appends to its own output
rules: [RD7, CH4]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./gen.sh, t_start: 10.0, duration_s: 5.0,
     reads: []}
  - {command_id: e2, command: ./app.sh, t_start: 20.0, duration_s: 5.0,
     reads: [/repo/out/log.txt]}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: out/log.txt, op: create, writer_id: e1}
  - {link_type: write_event, path: out/log.txt, writer_id: e2}
paths:
  - {path: out/log.txt, tracked: false}
oracle_inputs:
  - {path: out/log.txt}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: out/log.txt, version: w0,
       must: true, state: derived}
  absent:
    hop_reads: [{input_id: i0, reader_node: w1, read_path: out/log.txt,
                 version: w1}]
  chain_nodes:
    - {input_id: i0, node_id: w1, hop: 1}
    - {input_id: i0, node_id: w0, hop: 2, must: true}
  row_counts: {chain_nodes: 2, hop_reads: 1}
