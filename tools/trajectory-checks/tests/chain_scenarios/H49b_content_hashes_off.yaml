id: H49b
title: Without hashes a command's rewrite of a baseline code file is a change
rules: [RD4, FA5]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e0, command: ./restore.sh, t_start: 5.0, duration_s: 2.0,
     reads: []}
  - {command_id: e1, command: python3 agg.py, t_start: 10.0, duration_s: 2.0,
     reads: [/repo/src/lib.py]}
dispositions:
  e0: {disposition: matched_root, root_under: true}
  e1: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: src/lib.py, writer_id: e0}
  - {link_type: write_event, path: out/r.json, writer_id: e1}
classes: {src/lib.py: code}
baseline_files:
  - {path: src/lib.py, sha256: aa11}
  - agg.py
oracle_inputs:
  - {path: out/r.json}
expect:
  bases: {versions: fallback}
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: src/lib.py, version: w0,
       state: derived}
  chain_nodes:
    - {input_id: i0, node_id: w1, code_state: changed}
