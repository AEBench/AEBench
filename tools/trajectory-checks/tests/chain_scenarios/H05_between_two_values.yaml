id: H05
title: Two README lines declare two values; the writer runs one between
rules: [ARG1, ARG2]
execs:
  - {command_id: e1, command: "./tool.sh --k 5", t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --k 3",
       options: {--k: {value: "3", value_type: int}}}
    - {invocation_key: tool.sh, text: "./tool.sh --k 10",
       options: {--k: {value: "10", value_type: int}}}
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --k, comparison: between,
       effective: between,
       declared_values: [{value: "3", value_type: int},
                         {value: "10", value_type: int}]}
  metrics:
    M5.1: {args_between_under: 1, args_between_over: 1}
