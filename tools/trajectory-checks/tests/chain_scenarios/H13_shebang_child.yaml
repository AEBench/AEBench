id: H13
title: A script and the child exec its shebang starts count once
rules: [ARG5]
calls:
  - {call_id: c1, command: "./tool.sh --k 3", t_start: 9.0}
execs:
  - {command_id: e1, command: "./tool.sh --k 3", t_start: 10.0,
     duration_s: 10.0}
  - {command_id: e2, command: "./tool.sh --k 3", t_start: 11.0,
     duration_s: 5.0}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: exec_parent, command_id: e2, parent: e1, root_call_id: c1}
  - {link_type: write_event, path: out/r.json, writer_id: e2}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --k 3",
       options: {--k: {value: "3", value_type: int}}}
expect:
  row_counts: {arg_checks: 1}
  arg_checks:
    - {command_id: e2, invocation: 0, option: --k, comparison: equal,
       in_scope: {writer: [i0]}}
  absent:
    arg_checks: [{command_id: e1, invocation: 0, option: --k}]
  metrics:
    M5.1: {args_equal_under: 1, options_compared_over: 1}
