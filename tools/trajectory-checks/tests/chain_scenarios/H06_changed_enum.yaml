id: H06
title: An enum option runs with another value than the declared one
rules: [ARG2]
execs:
  - {command_id: e1, command: "./tool.sh --mode fast", t_start: 10.0,
     duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --mode full",
       options: {--mode: {value: full, value_type: enum}}}
  options:
    - {invocation_key: tool.sh, option: --mode, takes_value: true,
       source_path: tool.sh}
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --mode, comparison: changed,
       effective: changed, executed: {value: fast, value_type: enum,
                                      origin: explicit}}
  metrics:
    M5.1: {args_changed_under: 1, args_changed_over: 1}
