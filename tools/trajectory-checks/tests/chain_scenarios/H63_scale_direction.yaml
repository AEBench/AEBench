id: H63
title: A scale option above and a non-scale option below
rules: [SC1, SC2]
execs:
  - {command_id: e1, command: "./tool.sh --iters 20 -j 2", t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --iters 10 -j 4",
       options: {--iters: {value: "10", value_type: int},
                 -j: {value: "4", value_type: int}}}
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --iters, comparison: above,
       scale_option: true, scale_reduced: false}
    - {command_id: e1, invocation: 0, option: -j, comparison: below,
       scale_option: false, scale_reduced: false}
  faithfulness:
    - {input_id: i0, scale_reduced_under: false, scale_reduced_over: false}
