       effective: null, declared_values: [], declared_origin: [],
       conforms: null}
    - {command_id: e1, invocation: 0, option: --k, comparison: equal}
  metrics:
    M5.1: {args_added_under: 1, args_added_over: 1, args_equal_under: 1,
           options_compared_under: 2, args_unmarked_deviations_under: 1}
