id: H58
title: Malformed entries of the declared table are skipped with warnings
rules: [CT1, CT5]
execs:
  - {command_id: e1, command: "./tool.sh --k 5", t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --k 3",
       options: {--k: {value: "3", value_type: int}}}
spec:
  options: {"tool.sh --k": sometimes, nospace: min}
  lineup: [x]
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --k, marker: null,
       contract: null}
  warnings_include:
    - "declared tool.sh --k: unknown marker sometimes"
    - "declared nospace: no space"
    - "declared lineup: unknown key"
