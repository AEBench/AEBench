id: H03
title: Writer runs a scale option above the declared value, through an alias
rules: [ARG2, SC2, KEY8]
execs:
  - {command_id: e1, command: "python3 tools/run.py -n 20", t_start: 10.0,
     duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tools/run.py, text: "python3 tools/run.py --iters 10",
       options: {--iters: {value: "10", value_type: int}}}
  options:
    - {invocation_key: tools/run.py, option: --iters, aliases: [--iters, -n],
       default: {value: "10", value_type: int}}
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --iters, comparison: above,
       effective: above, scale_option: true, scale_reduced: false,
       executed: {value: "20", value_type: int, origin: explicit},
       declared_values: [{value: "10", value_type: int}],
       declared_origin: [readme]}
  row_counts: {arg_checks: 1}
  metrics:
    M5.1: {args_above_under: 1, args_above_over: 1, scale_reduced_under: 0}
