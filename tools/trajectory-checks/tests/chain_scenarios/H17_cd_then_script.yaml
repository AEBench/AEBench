id: H17
title: cd into a folder, then run a script, keys like the README's path
rules: [KEY2, KEY3, KEY4]
execs:
  - {command_id: e1, command: "cd tools && python run.py --n 2",
     t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tools/run.py, text: "python tools/run.py --n 2",
       options: {--n: {value: "2", value_type: int}}}
expect:
  row_counts: {arg_checks: 1}
  arg_checks:
    - {command_id: e1, invocation: 1, option: --n,
       invocation_key: tools/run.py, comparison: equal}
