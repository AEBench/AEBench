id: H55
title: Exact markers on an omitted option equal by default and an added one
rules: [CT2, ARG7]
execs:
  - {command_id: e1, command: "python3 tools/run.py --extra 1", t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tools/run.py, text: "python3 tools/run.py --iters 10",
       options: {--iters: {value: "10", value_type: int}}}
  options:
    - {invocation_key: tools/run.py, option: --iters,
       default: {value: "10", value_type: int}}
spec:
  options: {"tools/run.py --iters": exact, "tools/run.py --extra": exact}
expect:
  arg_checks:
    - {command_id: e1, invocation: 0, option: --iters, comparison: omitted,
       effective: equal, marker: exact, contract: holds, conforms: holds}
    - {command_id: e1, invocation: 0, option: --extra, comparison: added,
       effective: null, marker: exact, contract: violated,
       conforms: violated}
  faithfulness:
    - {input_id: i0, clauses: {derived: violated}}
  metrics:
    M5.1: {args_contract_violated_under: 1}
