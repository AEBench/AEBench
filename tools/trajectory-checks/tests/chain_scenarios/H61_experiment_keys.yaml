id: H61
title: With experiment keys a pristine data read downstream violates 4b
rules: [CT4, FA7]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: ./bench.sh, t_start: 10.0, duration_s: 10.0,
     reads: []}
  - {command_id: e2, command: python3 agg.py, t_start: 30.0, duration_s: 2.0,
     reads: [/repo/out/raw.csv, /repo/data/ref.csv]}
dispositions:
  e1: {disposition: matched_root, root_under: true}
  e2: {disposition: matched_root, root_under: true}
links:
  - {link_type: write_event, path: out/raw.csv, op: create, writer_id: e1}
  - {link_type: write_event, path: out/r.json, op: create, writer_id: e2}
paths:
  - {path: out/raw.csv, tracked: false}
  - {path: out/r.json, tracked: false}
baseline_files: [data/ref.csv]
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: bench.sh, text: ./bench.sh, position: 0}
    - {invocation_key: agg.py, text: python3 agg.py, position: 1}
spec:
  experiment_keys: [bench.sh]
expect:
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: data/ref.csv,
       version: baseline, state: pristine, must: true}
  faithfulness:
    - {input_id: i0, witness: "e1:0", clauses: {unmodified: violated,
                                                derived: holds}}
