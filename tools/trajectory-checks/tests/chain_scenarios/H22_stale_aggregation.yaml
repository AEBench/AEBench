id: H22
title: An aggregator reads a committed result file and nothing ran upstream
rules: [FA7]
run:
  capabilities: {read_tracing: true}
execs:
  - {command_id: e1, command: python3 agg.py, t_start: 10.0, duration_s: 2.0,
     reads: [/repo/agg.py, /repo/results/raw.csv]}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: results/summary.json, op: create,
     writer_id: e1}
paths:
  - {path: results/summary.json, tracked: false}
baseline_files: [agg.py, results/raw.csv]
oracle_inputs:
  - {path: results/summary.json}
declared:
  invocations:
    - {invocation_key: "make:sim", text: make sim, position: 0}
    - {invocation_key: bench.sh, text: ./bench.sh, position: 1}
    - {invocation_key: agg.py, text: python3 agg.py, position: 2}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w0, read_path: results/raw.csv,
       version: baseline, state: pristine, must: true, code_read: false}
  faithfulness:
    - {input_id: i0, witness: "e1:0",
       clauses: {fresh: holds, derived: holds, built: holds,
                 unmodified: null, untampered: holds},
       faithful: null}
  metrics:
    M1.5: {chain_time_under_s: 2.0}
