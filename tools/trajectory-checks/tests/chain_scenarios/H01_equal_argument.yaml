id: H01
title: Writer runs the declared line with the declared value
rules: [ARG1, ARG2, ARG4]
description: >
  The second run's writer exec is not root_under: its row counts in the
  _over version only (ARG4, layer 1 D12).
execs:
  - {command_id: e1, command: "./tool.sh --k 3", t_start: 10.0, duration_s: 5.0}
dispositions: {e1: {disposition: matched_root, root_under: true}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
declared:
  invocations:
    - {invocation_key: tool.sh, text: "./tool.sh --k 3",
       options: {--k: {value: "3", value_type: int}}}
runs:
  - expect:
      arg_checks:
        - {command_id: e1, invocation: 0, option: --k, comparison: equal,
           effective: equal, conforms: holds, marker: null, contract: null,
           declared_origin: [readme],
           declared_values: [{value: "3", value_type: int}],
           executed: {value: "3", value_type: int, origin: explicit},
           scale_option: false, scale_reduced: false, root_under: true,
           in_scope: {writer: [i0], chain_under: null, chain_over: null,
                      before_writer: [i0], run: true}}
      row_counts: {arg_checks: 1}
      metrics:
        M5.1: {options_compared_under: 1, options_compared_over: 1,
               args_equal_under: 1, args_equal_over: 1, args_below_under: 0,
               args_above_under: 0, args_between_under: 0, args_changed_under: 0,
               args_added_under: 0, args_omitted_under: 0, args_below_over: 0,
               args_above_over: 0, args_unmarked_deviations_under: 0,
               args_unmarked_deviations_over: 0, writers_undeclared_program: 0,
               scope_under: writer, scope_over: before_writer,
               declared_keys_run: 1.0}
  - dispositions: {e1: {disposition: unrooted, root_under: false}}
    expect:
      arg_checks:
        - {command_id: e1, invocation: 0, option: --k, root_under: false,
           in_scope: {writer: [i0], before_writer: [i0], run: true}}
      metrics:
        M5.1: {options_compared_under: 0, options_compared_over: 1,
               args_equal_under: 0, args_equal_over: 1}
