id: H26
title: The writer exec's nested child reads a file
rules: [CH2]
run:
  capabilities: {read_tracing: true}
calls:
  - {call_id: c1, command: ./run.sh, t_start: 9.0}
execs:
  - {command_id: e0, command: ./prep.sh, t_start: 1.0, duration_s: 2.0,
     reads: []}
  - {command_id: e1, command: ./run.sh, t_start: 10.0, duration_s: 20.0,
     reads: []}
  - {command_id: e2, command: cat data/in.txt, t_start: 12.0, duration_s: 1.0,
     reads: [/repo/data/in.txt]}
dispositions: {e0: {disposition: matched_root, root_under: true}}
links:
  - {link_type: call_exec, call_id: c1, command_id: e1}
  - {link_type: exec_parent, command_id: e2, parent: e1, root_call_id: c1}
  - {link_type: write_event, path: data/in.txt, writer_id: e0}
  - {link_type: write_event, path: out/r.json, writer_id: e1}
oracle_inputs:
  - {path: out/r.json}
expect:
  hop_reads:
    - {input_id: i0, reader_node: w1, read_path: data/in.txt, version: w0,
       reader_exec: e2, must: true, hop: 1}
  chain_nodes:
    - {input_id: i0, node_id: w0, hop: 2, must: true}
