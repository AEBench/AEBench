name: G04_act_between_tracked
description: >
  Spec RS04. A rerun after success with an act call in between that wrote
  nothing observed (tracked scope): unchanged in the over-approximation
  only, by the fallback form of RR6.
rules: [OBS2, KEY2, RR1, RR5, RR6, REP2]
calls:
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 12}
  - {call_id: c2, command: cp -r in out, t_start: 20, t_end: 20}
  - {call_id: c3, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
  - {command_id: e2, call: c2, t_start: 20.1, t_end: 20.2}
  - {command_id: e3, call: c3, t_start: 30.1, t_end: 31.9}
expect:
  call_structure:
    c2: {call_class: act, class_reason: program, shape_class: s1, program_key: cp in}
  reruns:
    - {key_type: shape, class_id: s0, prev_call_id: c1, call_id: c3, calls_between: 1, act_calls_between: 1, writes_between_under: 0, writes_between_over: 0, untracked_writes_between: null, gap_observed: true, unchanged_under: false, unchanged_over: true}
  structure:
    M2.2.reruns_after_success_under: 1
    M2.2.reruns_after_success_unchanged_under: 0
    M2.2.reruns_after_success_unchanged_over: 1
    bases.unchanged_under: fallback
