name: G47_cp06_final_content_false
description: >
  Spec CP06, false half. Without final content every binary_content is
  null and binary_changed_by_class is null with a warning; the classes are
  identical to the true half (D31).
rules: [BIN1, CLS5, FC5, FC8]
calls:
  - {call_id: c1, command: ./make_all.sh 3, t_start: 10, t_end: 20}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 19.9}
links:
  - {link_type: write_event, path: data/x.dat, writer_id: e1}
  - {link_type: write_event, path: src/a.py, writer_id: e1}
  - {link_type: write_event, path: results/plot.png, writer_id: e1}
  - {link_type: write_event, path: b.c, writer_id: e1}
paths:
  - {path: b.c, final_state: reverted}
expect:
  file_classes:
    data/x.dat: {file_class: data, class_rule: FC8, binary_content: null}
    src/a.py: {file_class: code, class_rule: FC5, binary_content: null}
    results/plot.png: {file_class: data, class_rule: FC8, binary_content: null}
    b.c: {file_class: code, class_rule: FC5, binary_content: null}
  structure:
    preconditions.final_content: fails
    M4.2.binary_changed_by_class: null
    M4.2.changed_by_class: {code: 1, data: 2}
  warnings: [precondition final_content]
