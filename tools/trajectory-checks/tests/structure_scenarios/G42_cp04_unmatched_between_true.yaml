name: G42_cp04_unmatched_between_true
description: >
  Spec CP04, true half. CP03 with the act call in between unmatched: the
  exact form needs every act call in between matched with certainty, so
  unchanged_under is false.
rules: [RR6]
run: {capabilities: {untracked_visible: true}}
calls:
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 12}
  - {call_id: c2, command: cp -r in out, t_start: 20, t_end: 21}
  - {call_id: c3, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9, snapshot: {created_untracked: [], modified_untracked: [], deleted_untracked: []}}
  - {command_id: e3, call: c3, t_start: 30.1, t_end: 31.9, snapshot: {created_untracked: [], modified_untracked: [], deleted_untracked: []}}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c3, act_calls_between: 1, untracked_writes_between: 0, gap_observed: true, unchanged_under: false, unchanged_over: true}
  structure:
    bases.unchanged_under: exact
