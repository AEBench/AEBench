name: G75_write_at_gap_start
description: >
  RR5 (critic cycle 2, test gap 5): the gap is (prev_end, next_start],
  open at its start. An exec write of another root whose order_t equals
  prev_end (11.9) is not in the gap and is not counted; its exec overlaps
  the gap but its snapshot is ok, so the gap is observed and the rerun is
  unchanged in both forms.
rules: [RR5, RR6]
calls:
  - {call_id: c0, command: ./serve.sh &, t_start: 1, t_end: 2}
  - {call_id: c1, command: ./run.sh 3, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.sh 3, t_start: 30, t_end: 32}
execs:
  - {command_id: e0, call: c0, t_start: 1.1, t_end: 1.5}
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
  - {command_id: e0b, command: sync_worker, t_start: 11.0, t_end: 11.9}
  - {command_id: e2, call: c2, t_start: 30.1, t_end: 31.9}
links:
  - {link_type: exec_parent, command_id: e0b, parent: e0, root_call_id: c0}
  - {link_type: write_event, path: out/state.dat, writer_id: e0b, writer_under: true, order_t: 11.9}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c2, writes_between_under: 0, writes_between_over: 0, gap_observed: true, unchanged_under: true, unchanged_over: true}
    - {key_type: program, prev_call_id: c1, call_id: c2, writes_between_under: 0, writes_between_over: 0}
  reruns_exact: true
