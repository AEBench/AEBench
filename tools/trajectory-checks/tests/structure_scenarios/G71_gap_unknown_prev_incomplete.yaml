name: G71_gap_unknown_prev_incomplete
description: >
  Reading S4 (critic cycle 1): the previous call's root exec is incomplete
  (still running, no exit code), so where its gap starts is unknown; the
  gap is not vacuously observed: gap_observed and unchanged_under are
  false.
rules: [RR5, RR6]
calls:
  - {call_id: c1, command: ./run.sh 3, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.sh 3, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9, complete: false, exit_code: null}
  - {command_id: e2, call: c2, t_start: 30.1, t_end: 31.9}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c2, prev_outcome: unknown, gap_observed: false, unchanged_under: false}
    - {key_type: program, prev_call_id: c1, call_id: c2, gap_observed: false, unchanged_under: false}
  reruns_exact: true
