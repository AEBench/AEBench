name: G14_words_changed
description: >
  Spec RS13 (with a shared first operand, so the program key is equal). A
  changed word with the same argument count is a words change.
rules: [RR3, REP3]
calls:
  - {call_id: c1, command: ./run.py go x, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.py go y, t_start: 20, t_end: 22}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
  - {command_id: e2, call: c2, t_start: 20.1, t_end: 21.9}
expect:
  call_structure:
    c1: {program_key: run.py go, shape_class: s0}
    c2: {program_key: run.py go, shape_class: s1}
  reruns:
    - {key_type: program, prev_call_id: c1, call_id: c2, arg_change_type: words, arg_count_delta: 0, words_removed: [x], words_added: [y], narrowed: false}
  reruns_exact: true
  structure:
    M2.3.words_changed: 1
    M2.3.narrowed: 0
