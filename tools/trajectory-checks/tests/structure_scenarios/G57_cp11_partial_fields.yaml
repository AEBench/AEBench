name: G57_cp11_partial_fields
description: >
  Spec CP11. parent_links and exact_timing are true, but one writer exec
  has no root_command_id (PRE8: it falls back to its J2 root, one warning,
  writes_between basis fallback) and one incomplete exec has no ended_at
  (not a mismatch: it lasts to the run's end, no warning, gap basis
  exact).
rules: [PRE8, RR5, RR6]
run: {capabilities: {parent_links: true, exact_timing: true}}
calls:
  - {call_id: c0, command: ./serve.sh &, t_start: 1, t_end: 2}
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e0, call: c0, t_start: 1.1, t_end: 1.5, depth: 0, root_command_id: e0, released_at: 1.15, ended_at: 1.45}
  - {command_id: e0b, command: serve, t_start: 1.2, t_end: 1.3, complete: false, exit_code: null, depth: 1, root_command_id: e0, released_at: 1.25, ended_at: null, snapshot: {status: absent, scope: null}}
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9, depth: 0, root_command_id: e1, released_at: 10.2, ended_at: 11.8}
  - {command_id: e1b, command: sync_worker, t_start: 10.9, t_end: 20.1, depth: 1, root_command_id: null, released_at: 11.0, ended_at: 20.0}
  - {command_id: e2, call: c2, t_start: 30.1, t_end: 31.9, depth: 0, root_command_id: e2, released_at: 30.3, ended_at: 31.7}
links:
  - {link_type: exec_parent, command_id: e0b, parent: e0, root_call_id: c0}
  - {link_type: exec_parent, command_id: e1b, parent: e0, root_call_id: c0, root_ambiguous: true, root_candidates: [c0, c1]}
  - {link_type: write_event, path: out/state.dat, writer_id: e1b, writer_under: false}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c2, writes_between_under: 0, writes_between_over: 1, gap_observed: false, unchanged_under: false, unchanged_over: true}
  structure:
    bases: {writes_between: fallback, gap: exact, unchanged_under: fallback}
  warnings: ["capability parent_links true but root_command_id missing on 1 records: fallback used", precondition untracked_visible, baseline_by_class, precondition final_content]
  warnings_exact: true
