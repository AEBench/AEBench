name: G29_reverted
description: >
  Spec FS05. A code file written and restored is reverted: counted in
  reverted_by_class, not in changed_by_class.
rules: [CLS2]
calls:
  - {call_id: c1, command: ./try.sh 3, t_start: 10, t_end: 12}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
links:
  - {link_type: write_event, path: src/lib.c, writer_id: e1}
paths:
  - {path: src/lib.c, final_state: reverted}
expect:
  file_classes:
    src/lib.c: {file_class: code, class_rule: FC5, extension: .c}
  structure:
    M4.2.reverted_by_class: {code: 1}
    M4.2.changed_by_class: {}
    M4.2.shell_written_by_class_over: {}
