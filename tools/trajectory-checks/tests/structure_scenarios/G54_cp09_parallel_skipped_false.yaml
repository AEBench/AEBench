name: G54_cp09_parallel_skipped_false
description: >
  Spec CP09, false half. Without MC-05 the fallback form applies: the act
  call in between makes unchanged_under false; the gap is observed.
rules: [RR6]
calls:
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 20.2}
  - {call_id: c2, command: ./prep.sh, t_start: 10.5, t_end: 12.5}
  - {call_id: c3, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 20.0}
  - {command_id: e2, call: c2, t_start: 10.6, t_end: 12.0, snapshot: {status: skipped, scope: null, skip_reason: too many files}}
  - {command_id: e3, call: c3, t_start: 30.1, t_end: 31.9}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c3, act_calls_between: 1, untracked_writes_between: null, gap_observed: true, unchanged_under: false, unchanged_over: true}
  structure:
    bases.unchanged_under: fallback
