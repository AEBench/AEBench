name: G02_rerun_after_success_unchanged
description: >
  Spec RS02. An identical rerun after a success with nothing in between is
  unchanged in both versions.
rules: [RR5, RR6, REP2]
calls:
  - {call_id: c1, command: ./run.sh 3, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.sh 3, t_start: 20, t_end: 22}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
  - {command_id: e2, call: c2, t_start: 20.1, t_end: 21.9}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c2, prev_outcome: ok, calls_between: 0, act_calls_between: 0, edit_calls_between: 0, writes_between_under: 0, writes_between_over: 0, gap_observed: true, unchanged_under: true, unchanged_over: true}
  structure:
    M2.2.reruns_after_success_under: 1
    M2.2.reruns_after_success_over: 1
    M2.2.reruns_after_success_unchanged_under: 1
    M2.2.reruns_after_success_unchanged_over: 1
    M2.2.reruns_after_failure_over: 0
    bases: {writes_between: fallback, gap: fallback, unchanged_under: fallback}
