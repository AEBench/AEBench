name: G37_cp01_parent_links_exact
description: >
  Spec CP01, true half (the false half is G05). The background writer has
  depth 1 and root_command_id naming the previous call's root exec, so its
  write is the endpoint's own and is not counted, although J2 guessed
  another root.
rules: [RR5, RR6, REP2, PRE8]
run: {capabilities: {parent_links: true}}
calls:
  - {call_id: c0, command: ./serve.sh &, t_start: 1, t_end: 2}
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 12}
  - {call_id: c2, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e0, call: c0, t_start: 1.1, t_end: 1.5, depth: 0, root_command_id: e0}
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9, depth: 0, root_command_id: e1}
  - {command_id: e1b, command: sync_worker, t_start: 11.0, t_end: 20.0, depth: 1, root_command_id: e1}
  - {command_id: e2, call: c2, t_start: 30.1, t_end: 31.9, depth: 0, root_command_id: e2}
links:
  - {link_type: exec_parent, command_id: e1b, parent: e0, root_call_id: c0, root_ambiguous: true, root_candidates: [c0, c1]}
  - {link_type: write_event, path: out/state.dat, writer_id: e1b, writer_under: false}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c2, writes_between_under: 0, writes_between_over: 0, gap_observed: true, unchanged_under: true, unchanged_over: true}
  structure:
    bases.writes_between: exact
    bases.gap: fallback
    capabilities.parent_links: true
    M2.2.reruns_after_success_unchanged_under: 1
  warnings: [precondition untracked_visible, baseline_by_class, precondition final_content]
  warnings_exact: true
