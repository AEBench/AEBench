name: G56_cp10_untracked_listed_false
description: >
  Spec CP10, false half. Without MC-05 the lists are null, the untracked
  count is null, and the act call in between makes unchanged_under false.
rules: [RR5, RR6]
calls:
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 12}
  - {call_id: c2, command: cp -r in out, t_start: 20, t_end: 21}
  - {call_id: c3, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 11.9}
  - {command_id: e2, call: c2, t_start: 20.1, t_end: 20.2}
  - {command_id: e3, call: c3, t_start: 30.1, t_end: 31.9}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c3, untracked_writes_between: null, unchanged_under: false, unchanged_over: true}
