name: G52_cp09_parallel_skipped_true
description: >
  Spec CP09, true half. The act call in between started in parallel with
  the previous call; its exec lies inside the previous call's interval
  (also after widening by the 2 s slop), so it does not overlap the gap
  and the gap is observed; but its snapshot is skipped, and the exact form
  needs a complete snapshot of every act call in between (D32).
rules: [RR5, RR6]
run: {capabilities: {untracked_visible: true}}
calls:
  - {call_id: c1, command: ./run.sh, t_start: 10, t_end: 20.2}
  - {call_id: c2, command: ./prep.sh, t_start: 10.5, t_end: 12.5}
  - {call_id: c3, command: ./run.sh, t_start: 30, t_end: 32}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 20.0, snapshot: {created_untracked: [], modified_untracked: [], deleted_untracked: []}}
  - {command_id: e2, call: c2, t_start: 10.6, t_end: 12.0, snapshot: {status: skipped, scope: null, skip_reason: too many files}}
  - {command_id: e3, call: c3, t_start: 30.1, t_end: 31.9, snapshot: {created_untracked: [], modified_untracked: [], deleted_untracked: []}}
expect:
  reruns:
    - {key_type: shape, prev_call_id: c1, call_id: c3, calls_between: 1, act_calls_between: 1, untracked_writes_between: 0, gap_observed: true, unchanged_under: false, unchanged_over: true}
  structure:
    bases.unchanged_under: exact
