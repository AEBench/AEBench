name: OS02_graded_source
description: >
  Capability oracle_reads: the graded manifest is the source (basis
  exact); a null-agent manifest passed alongside gives no row and only
  the oracle_writes fallback (final_content false).
rules: [OI1, OI3, OI10]
run: {capabilities: {oracle_reads: true}}
baseline: {files: {data/a.csv: {sha256: aa}}}
graded_manifest:
  - {check_id: read_a, path: /repo/data/a.csv, exists: true, sha256: ab, mtime_ns: 5}
null_manifest:
  - {check_id: read_a, path: /repo/data/a.csv, exists: true, sha256: a9, exists_before: true, sha256_before: aa, tracked_before: true}
  - {check_id: read_z, path: /repo/data/z.csv, exists: true, sha256: zz, exists_before: true, sha256_before: zz, tracked_before: true}
null_score: {phases: {experiment_runs: success}}
run_score: {phases: {experiment_runs: success}}
expect:
  oracle_inputs:
    - {input_id: i0, path: data/a.csv, source_type: graded, at_baseline: true, baseline_sha256: aa, tracked_at_baseline: true, null_sha256: null, grading_exists: true, grading_sha256: ab, grading_mtime_ns: 5, oracle_writes: true, oracle_writes_basis: fallback}
  oracle_inputs_exact: true
  absent: [data/z.csv]
  block:
    bases.source: exact
    bases.oracle_writes: fallback
    M3.1.source_type: graded
    M3.1.inputs_under: 1
    M3.1.inputs_oracle_written: 1
