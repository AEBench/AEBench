name: OS22_fallback_oracle_writes
description: >
  OS17 with final_content false: every oracle_writes comes from the
  null-agent manifest, which says A is written and B is not; C as in
  OS17. Bases fallback.
rules: [OI10]
run: {capabilities: {oracle_reads: true}}
baseline: {files: {data/a.csv: {sha256: aa}, data/b.csv: {sha256: bb}}}
graded_manifest:
  - {check_id: read_a, path: /repo/data/a.csv, exists: true, sha256: a2, mtime_ns: 7}
  - {check_id: read_b, path: /repo/data/b.csv, exists: true, sha256: b1}
  - {check_id: stat_c, method: path_exists, path: /tmp/c.log, exists: true}
null_manifest:
  - {check_id: read_a, path: /repo/data/a.csv, exists: true, sha256: a9, exists_before: true, sha256_before: aa, tracked_before: true}
  - {check_id: read_b, path: /repo/data/b.csv, exists: true, sha256: bb, exists_before: true, sha256_before: bb, tracked_before: true}
  - {check_id: stat_c, method: path_exists, path: /tmp/c.log, exists: true, exists_before: false}
final_files:
  - {path: data/a.csv, status: M, sha256: a1}
  - {path: data/b.csv, status: M, sha256: b1}
null_score: {phases: {experiment_runs: success}}
run_score: {phases: {experiment_runs: success}}
expect:
  oracle_inputs:
    - {path: data/a.csv, oracle_writes: true, oracle_writes_basis: fallback}
    - {path: data/b.csv, oracle_writes: false, oracle_writes_basis: fallback}
    - {path: /tmp/c.log, oracle_writes: true, oracle_writes_basis: fallback}
  oracle_inputs_exact: true
  block:
    bases.oracle_writes: fallback
    M3.1.inputs_oracle_written: 2
