name: OS12_no_run_result
description: >
  No run/oracle_result.json: the run fields and the phase comparison are
  void, the null fields are computed.
rules: [NS4]
null_manifest:
  - {check_id: read_a, path: /repo/data/a.csv, exists: true, sha256: aa, exists_before: true, sha256_before: aa, tracked_before: true}
null_score: {phases: {benchmark_prep: success, experiment_runs: failure}}
expect:
  block:
    preconditions.run_score: fails
    M3.5.null_score: 1
    M3.5.null_score_max: 2
    M3.5.null_phases_passed: [benchmark_prep]
    M3.5.run_score: null
    M3.5.run_score_max: null
    M3.5.score_gain: null
    M3.5.phases_passed_by_null: null
    M3.5.phases_gained: null
    M3.5.phases_lost: null
    M3.1.inputs_under: 1
