name: P19b_oracle_writes_fallback_false
description: >
  P01 with oracle_writes false, basis fallback (every old run): the
  strict model excludes oracle_written, the relaxed one does not (D33).
rules: [CON1]
calls:
  - {call_id: c1, command: make, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa, oracle_writes: false, oracle_writes_basis: fallback}
expect:
  input_states:
    out/r.json: {oracle_writes: false, states_under: [pristine], states_over: [pristine, rewritten_identical, oracle_written], state_under: pristine}
