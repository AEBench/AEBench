name: P28_trace_not_ok
description: >
  trace_ok false (C0.1 fails) on an unchanged tracked input: nothing is
  observable, so the strict absence rule cannot apply; under M_s (S3) the
  committed content is still certain from the final diff. Without a trace
  no process can be excluded from writing after the final diff, so M_r
  does not read it (D73).
rules: [PRE3, EVD6]
run: {trace_ok: false}
calls:
  - {call_id: c1, command: make, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {observable: false, states_under: [pristine, rewritten_identical], states_over: [pristine, rewritten_identical, command_written, deleted], state_under: null, under_reason: writers_unobserved}
  counts:
    preconditions.trace: fails
    bases.shim: fallback
    M3.2.baseline_content_under: 1
    M3.2.unseen_writer_possible: 1
  warnings_exact: true
