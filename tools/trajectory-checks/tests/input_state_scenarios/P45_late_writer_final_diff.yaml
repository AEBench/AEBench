name: P45_late_writer_final_diff
description: >
  A root exec whose command ends in & deletes a tracked input and may
  outlive the broker's stop (EVD8, fallback); the final diff says deleted. The
  run has no MC-03, so the final diff's order against a late write is not
  recorded: M_s (S3) still reads it, M_r does not (D73), and states_over
  keeps the labels a late write could make (Lemma O).
rules: [EVD2, CON3, S3]
calls:
  - {call_id: c1, command: ./daemon.sh &, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {deleted: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1, op: delete}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {deleted: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {content_source: final_diff, grading_exists: false, detached_execs: [e1], states_under: [deleted], state_under: deleted, states_over: [rewritten_identical, command_written, deleted]}
  counts:
    M3.2.absent_under: 1
    M3.2.absent_over: 1
    M3.2.agent_written_over: 1
