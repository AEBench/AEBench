name: P45b_late_writer_final_files
description: >
  P45 with MC-03: final_files lists the input deleted. MC-03 takes the
  end-of-agent state after the agent's container stopped (D35), so no
  agent process writes after it and both models read it (D73).
rules: [EVD2, CON3]
capabilities: {final_content: true}
calls:
  - {call_id: c1, command: ./daemon.sh &, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {deleted: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1, op: delete}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {deleted: [out/r.json]}
final_files:
  - {path: out/r.json, status: D}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {content_source: final_workspace, grading_exists: false, detached_execs: [e1], states_under: [deleted], states_over: [deleted]}
  counts:
    M3.2.agent_written_over: 0
