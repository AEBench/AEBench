name: P02b_detached_exact
description: >
  P02 with parent_links and every exec's orphans a list, that exec's
  empty: the exact form of EVD8 lists nothing.
rules: [EVD8]
capabilities: {parent_links: true}
calls:
  - {call_id: c1, command: ./serve.sh &, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, depth: 0, root_command_id: e1, parent_link: none, orphans: []}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {state_under: pristine, detached_execs: [], unseen_writer_possible: false}
  counts:
    bases.detached: exact
    M3.2.detached_possible: false
    M3.2.unseen_writer_possible: 0
