name: P19_oracle_writes_null
description: >
  P01 with oracle_writes null: S5 reads it as false in the strict model,
  the relaxed model keeps oracle_written.
rules: [CON1, S5]
calls:
  - {call_id: c1, command: make, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa, oracle_writes: null, oracle_writes_basis: null}
expect:
  input_states:
    out/r.json: {oracle_writes: null, states_under: [pristine], states_over: [pristine, rewritten_identical, oracle_written]}
