name: P40_exact_timing
description: >
  exact_timing: a skipped exec whose [t_start, t_end] meets the input's
  window but whose [released_at, ended_at] ends before the final writer
  starts is not a blind window (basis exact).
rules: [EVD7]
capabilities: {exact_timing: true}
calls:
  - {call_id: c1, command: ./big.sh, t_start: 10, t_end: 36}
  - {call_id: c2, command: ./gen.sh, t_start: 30}
execs:
  - {command_id: e1, call: c1, t_start: 10.1, t_end: 35, released_at: 10.1, ended_at: 20, snapshot: {status: skipped, skip_reason: limit}}
  - {command_id: e2, call: c2, t_start: 30.1, released_at: 30.1, ended_at: 31.1, snapshot: {modified: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {modified: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {blind_execs: [], state_under: command_written, states_over: [command_written], unseen_writer_possible: false}
  counts:
    bases.timing: exact
