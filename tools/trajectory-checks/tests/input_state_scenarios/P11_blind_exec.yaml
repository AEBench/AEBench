name: P11_blind_exec
description: >
  P10 with one skipped exec before grading: the strict absence rule is
  not used inside the window, so a command is the one strict label.
rules: [EVD7, CON9, CNT4]
calls:
  - {call_id: c1, command: ls, t_start: 10}
  - {call_id: c2, command: ./big.sh, t_start: 20}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
  - {command_id: e2, call: c2, t_start: 20.2, snapshot: {status: skipped, skip_reason: limit}}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {modified: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {states_under: [command_written], states_over: [command_written], state_under: command_written, blind_execs: [e2], unseen_writer_possible: true, model_conflict: false}
  counts:
    M3.2.written_unseen_under: 1
    M3.2.written_unseen_over: 1
