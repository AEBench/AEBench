name: P18b_oracle_writes_fallback_true
description: >
  oracle_writes true with basis fallback, on a tracked input in the final
  diff with an exec final writer: the null-agent answer binds only the
  strict model (D33).
rules: [CON1, S5]
calls:
  - {call_id: c1, command: ./gen.sh, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {modified: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {modified: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa, oracle_writes: true, oracle_writes_basis: fallback}
expect:
  input_states:
    out/r.json: {states_under: [oracle_written], states_over: [command_written, oracle_written]}
  counts:
    M3.2.agent_written_under: 0
    M3.2.agent_written_over: 1
