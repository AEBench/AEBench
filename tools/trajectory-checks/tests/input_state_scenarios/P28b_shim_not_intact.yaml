name: P28b_shim_not_intact
description: >
  trace_ok true but RunInfo.shim_intact false (MC-17): snapshots are not
  trusted, every row is unobservable (basis exact), with a warning. A
  broken shim is a late-write cause, so M_r does not read the final diff
  (D73): command_written and deleted stay in states_over.
rules: [EVD6, PRE3]
run: {shim_intact: false}
calls:
  - {call_id: c1, command: make, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}, out/s.json: {sha256: ss}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
  - {path: out/s.json, at_baseline: true, baseline_sha256: ss}
expect:
  input_states:
    out/r.json: {observable: false, states_under: [pristine, rewritten_identical], states_over: [pristine, rewritten_identical, command_written, deleted]}
    out/s.json: {observable: false}
  counts:
    preconditions.trace: holds
    bases.shim: exact
  warnings: ["shim not intact: snapshots not trusted"]
  warnings_exact: true
