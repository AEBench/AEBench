name: P12b_untracked_final_files
description: >
  P12 with final_content and the path in final_files (status A, a hash):
  the end-of-agent state is the content source and the label is certain.
rules: [EVD2, EVD3, CNT4]
capabilities: {final_content: true}
calls:
  - {call_id: c1, command: ./gen.sh, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {src/main.py: {sha256: mm}}}
final_diff: {}
final_files:
  - {path: out/new.csv, status: A, sha256: bb}
oracle_inputs:
  - {path: out/new.csv, at_baseline: false}
expect:
  input_states:
    out/new.csv: {content_source: final_workspace, grading_exists: true, grading_sha256: bb, content_cmp: differs, states_under: [command_written], states_over: [command_written], state_under: command_written, observable: false}
  counts:
    preconditions.content: holds
    M3.2.created_by_agent_under: 1
    M3.2.created_by_agent_over: 1
    M3.2.written_unseen_under: 1
