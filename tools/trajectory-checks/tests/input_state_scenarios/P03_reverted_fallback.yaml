name: P03_reverted_fallback
description: >
  A tracked input with one exec event and not in the final diff (layer
  1's reverted), content_hashes false: rewritten_identical in both
  models, rewrite_type null with basis fallback.
rules: [EVD3, CON4, CON5, CON7]
calls:
  - {call_id: c1, command: ./regen.sh, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {modified: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
paths:
  - {path: out/r.json, final_state: reverted}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {states_under: [rewritten_identical], states_over: [rewritten_identical], state_under: rewritten_identical, rewrite_type: null, events: [w0], final_writer: w0, final_writer_root: c1}
  counts:
    bases.content_hash: fallback
    M3.2.fresh_under: 1
    M3.2.baseline_content_under: 1
    M3.2.rewritten_same_content: null
    M3.2.rewritten_restored: null
