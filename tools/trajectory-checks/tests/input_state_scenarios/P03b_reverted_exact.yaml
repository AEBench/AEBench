name: P03b_reverted_exact
description: >
  P03 with content_hashes and the event's hash equal to the baseline's:
  rewrite_type same_content, basis exact.
rules: [CON7, CNT5]
capabilities: {content_hashes: true}
calls:
  - {call_id: c1, command: ./regen.sh, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {modified: [out/r.json], hashes: {out/r.json: aa}}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
paths:
  - {path: out/r.json, final_state: reverted}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {state_under: rewritten_identical, rewrite_type: same_content}
  counts:
    bases.content_hash: exact
    M3.2.rewritten_same_content: 1
    M3.2.rewritten_restored: 0
