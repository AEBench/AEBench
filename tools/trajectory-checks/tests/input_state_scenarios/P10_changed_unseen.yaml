name: P10_changed_unseen
description: >
  A tracked input in the final diff with no write event, every snapshot
  ok and nothing detached: the strict model is refuted (a change no
  snapshot saw); the relaxed model keeps a command.
rules: [CON9, CON13, CNT4]
calls:
  - {call_id: c1, command: ls, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {modified: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {states_under: [], states_over: [command_written], state_under: null, model_conflict: true, under_reason: model_conflict, unseen_writer_possible: true}
  counts:
    M3.2.model_conflicts: 1
    M3.2.written_unseen_under: 0
    M3.2.written_unseen_over: 1
    M3.2.state_unknown_under: 1
    M3.2.agent_written_under: 0
    M3.2.agent_written_over: 1
