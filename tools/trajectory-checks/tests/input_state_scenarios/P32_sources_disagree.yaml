name: P32_sources_disagree
description: >
  A graded row without final_content: the grading hash equals the
  baseline's but the final diff says modified, and oracle_writes is null.
  The highest source is used, the strict model is refuted (the oracle or
  a late process wrote in between, D35).
rules: [EVD2, EVD4, CON12]
capabilities: {oracle_reads: true}
calls:
  - {call_id: c1, command: make, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {modified: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa, source_type: graded, grading_exists: true, grading_sha256: aa, oracle_writes: null, oracle_writes_basis: null}
expect:
  input_states:
    out/r.json: {content_source: grading_read, content_cmp: equal, grading_sha256: aa, content_sources_disagree: true, states_under: [], model_conflict: true, states_over: [pristine, rewritten_identical, oracle_written], under_reason: model_conflict}
  counts:
    M3.2.model_conflicts: 1
    M3.2.baseline_content_under: 0
    M3.2.baseline_content_over: 1
