name: P34_join_by_path
description: >
  A §0 path, already normalized by OI2, joins layer 1's events by string
  equality.
rules: [INP1, EVD5]
calls:
  - {call_id: c1, command: ./gen.sh, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {modified: [out/r.json, out/other.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1}
  - {link_type: write_event, path: out/other.json, writer_id: e1}
baseline: {files: {out/r.json: {sha256: aa}, out/other.json: {sha256: oo}}}
final_diff: {modified: [out/r.json, out/other.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {events: [w0], final_writer: w0, state_under: command_written}
  absent: [out/other.json]
