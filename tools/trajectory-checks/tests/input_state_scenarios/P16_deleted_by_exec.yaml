name: P16_deleted_by_exec
description: A tracked input deleted by one exec; layer 1 names the deletion.
rules: [EVD3, CON3, CON15]
calls:
  - {call_id: c1, command: rm out/r.json, t_start: 10}
execs:
  - {command_id: e1, call: c1, t_start: 10.2, snapshot: {deleted: [out/r.json]}}
links:
  - {link_type: write_event, path: out/r.json, writer_id: e1, op: delete}
paths:
  - {path: out/r.json, final_state: deleted}
baseline: {files: {out/r.json: {sha256: aa}}}
final_diff: {deleted: [out/r.json]}
oracle_inputs:
  - {path: out/r.json, at_baseline: true, baseline_sha256: aa}
expect:
  input_states:
    out/r.json: {grading_exists: false, content_cmp: differs, states_under: [deleted], states_over: [deleted], state_under: deleted, final_writer: w0}
  counts:
    M3.2.absent_under: 1
    M3.2.absent_over: 1
    M3.2.by_state_under.deleted: 1
