[package]
name = "aeshell"
version = "0.1.0"
edition = "2021"
description = "AEBench command-monitoring shim: a transparent bash wrapper"
publish = false

[[bin]]
name = "aeshell"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
