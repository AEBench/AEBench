<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>AEBench · traces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem('aebench-trace-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo">AE<span class="logo-accent">Bench</span></a>
      <a href="index.html" class="logo-sub">/ traces</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <section class="page-head">
    <div class="container page-head-inner">
      <h1>Agent traces</h1>
      <div class="hero-body">
        <div id="matrix-wrap" class="matrix-wrap" aria-label="Runs by case and model">
          <div class="matrix-scroll-frame">
            <div id="matrix" class="matrix"></div>
          </div>
          <div class="matrix-legend" id="matrix-legend" aria-hidden="true"></div>
        </div>
        <aside class="hero-stats" id="hero-stats" aria-label="Run totals"></aside>
      </div>
    </div>
  </section>

  <main class="container traces-browser">
    <section class="filter-dock" role="search">
      <div class="filter-group">
        <select id="case-filter" aria-label="Filter by case">
          <option value="">all cases</option>
        </select>
        <select id="model-filter" aria-label="Filter by model">
          <option value="">all models</option>
        </select>
        <select id="agent-filter" aria-label="Filter by agent">
          <option value="">all harnesses</option>
        </select>
        <select id="prompt-profile-filter" aria-label="Filter by prompt profile">
          <option value="">all prompt profiles</option>
        </select>
      </div>
      <label class="filter-search">
        <svg class="filter-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="q" aria-label="Search runs"
               placeholder="search runs…" />
      </label>
    </section>

    <div class="view-controls">
      <div class="view-controls-left">
        <select id="group-by" aria-label="Group runs">
          <option value="case">group by case</option>
          <option value="case-model">group by case × model</option>
          <option value="prompt-profile">group by prompt profile</option>
          <option value="none">no grouping</option>
        </select>
        <select id="sort" aria-label="Sort runs">
          <option value="score-desc">oracle score ↓</option>
          <option value="score-asc">oracle score ↑</option>
          <option value="cost-desc">cost ↓</option>
          <option value="turns-desc">turns ↓</option>
          <option value="duration-desc">duration ↓</option>
        </select>
      </div>
      <div class="view-controls-right">
        <span id="result-count" class="results-count muted hidden"></span>
        <button id="reset-filters" class="link-btn hidden" type="button">clear filters</button>
      </div>
    </div>

    <div id="runs" aria-live="polite"></div>
    <div id="empty" class="empty-state hidden">
      <p>No runs match the current filters.</p>
      <button class="btn btn-secondary" type="button" id="empty-reset">Clear filters</button>
    </div>
    <div id="loading" class="empty-state">
      <p class="muted">Loading runs…</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="assets/theme.js"></script>
  <script src="assets/tooltip.js"></script>
  <script src="assets/catalog.js"></script>
  <script src="assets/index.js"></script>
</body>
</html>
